.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.hx{fill:#0969da;font-weight:700}.ax{transform-box:view-box;transform-origin:44.8px 0;animation:pl-draw 1.4s cubic-bezier(.4,0,.2,1) .2s both}.dt{transform-box:fill-box;transform-origin:center;animation:pl-pop .45s cubic-bezier(.2,.8,.2,1) both}.cd{animation:pl-drop .55s cubic-bezier(.2,.8,.2,1) both}.sh{animation:pl-shut .3s cubic-bezier(.5,0,.6,1.6) both}.lk{transform-box:fill-box;transform-origin:center;animation:pl-click .4s ease-out both}@keyframes pl-draw{from{transform:scaleX(0)}to{transform:none}}@keyframes pl-pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}@keyframes pl-drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}@keyframes pl-shut{from{transform:translateY(-6px)}to{transform:none}}@keyframes pl-click{0%,55%{transform:none}75%{transform:scale(1.3)}100%{transform:none}}@media (prefers-reduced-motion:reduce){.ax,.dt,.cd,.sh,.lk{animation:none}}.mut{fill:#486380}.b{font-weight:700}
</style>
