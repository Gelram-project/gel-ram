<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="652" viewBox="0 0 1200 652" role="img" aria-labelledby="t d">
<title id="t">The memory core</title>
<desc id="d">The 7 parts of the memory core and the 5 dependencies their Cargo.toml files declare among them: Store, Reader and Rebuild build on Bit record; History builds on Bit record and Rebuild. Q8 record and Memory cost stand alone.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.cb{animation:core-in .55s cubic-bezier(.2,.8,.2,1) both}.cf{animation:core-draw .5s ease-out both}.ch,.cx{animation:core-fade .5s ease-out both}.cp{animation:core-run .8s ease-in-out both}.cg{animation:core-glow .9s ease-out both}@keyframes core-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes core-draw{from{stroke-dasharray:100 100;stroke-dashoffset:100}to{stroke-dasharray:100 100;stroke-dashoffset:0}}@keyframes core-fade{from{opacity:0}to{opacity:1}}@keyframes core-run{from{stroke:#0969da;stroke-dasharray:12 200;stroke-dashoffset:20}to{stroke:#0969da;stroke-dasharray:12 200;stroke-dashoffset:-110}}@keyframes core-glow{0%,100%{stroke:#0969da;stroke-opacity:0}35%{stroke:#0969da;stroke-opacity:1}}@media (prefers-reduced-motion:reduce){.cb,.cf,.ch,.cx,.cp,.cg{animation:none}}.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="650" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="650" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="42" style="font-size:16px">THE MEMORY CORE</text><text x="40" y="80" font-size="30" class="b">7 parts, 5 dependencies between them</text><text x="40" y="114" font-size="20" class="mut">Arrow A → B: B builds on A, as its Cargo.toml says</text><g class="cx" style="animation-delay:1.74s"><rect x="822.0" y="96.0" width="350.0" height="346.0" rx="18" fill="#0969da" fill-opacity=".05" stroke="#486380" stroke-width="2" stroke-dasharray="7 6"/><text x="840.0" y="123.0" font-size="18" class="b mut">stand alone</text></g><g class="cb" style="animation-delay:0.20s"><polygon points="40.0,306.0 350.0,306.0 350.0,436.0 40.0,436.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="350.0,306.0 364.0,292.0 364.0,422.0 350.0,436.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="40.0,306.0 54.0,292.0 364.0,292.0 350.0,306.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="40" y="306" width="310" height="130" fill="#ffffff" stroke="#cbdcf0"/><rect x="40" y="306" width="8" height="130" fill="#2f7fe0"/><text x="64" y="348" font-size="30" class="b">Bit record</text><text class="mono" x="64" y="376" font-size="19">gel-orb</text><text x="64" y="404" font-size="19">128 bytes, 1,024 bits</text><text x="64" y="427" font-size="19">round-trip exactly</text></g><g class="cb" style="animation-delay:0.42s"><polygon points="438.0,150.0 748.0,150.0 748.0,280.0 438.0,280.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="748.0,150.0 762.0,136.0 762.0,266.0 748.0,280.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="438.0,150.0 452.0,136.0 762.0,136.0 748.0,150.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="438" y="150" width="310" height="130" fill="#ffffff" stroke="#cbdcf0"/><rect x="438" y="150" width="8" height="130" fill="#2f7fe0"/><text x="462" y="192" font-size="30" class="b">Store</text><text class="mono" x="462" y="220" font-size="19">gel-store</text><text x="462" y="248" font-size="19">CRC64 over header</text><text x="462" y="271" font-size="19">and over payload</text></g><g class="cb" style="animation-delay:0.64s"><polygon points="438.0,306.0 748.0,306.0 748.0,436.0 438.0,436.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="748.0,306.0 762.0,292.0 762.0,422.0 748.0,436.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="438.0,306.0 452.0,292.0 762.0,292.0 748.0,306.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="438" y="306" width="310" height="130" fill="#ffffff" stroke="#cbdcf0"/><rect x="438" y="306" width="8" height="130" fill="#2f7fe0"/><text x="462" y="348" font-size="30" class="b">Reader</text><text class="mono" x="462" y="376" font-size="19">gel-reader</text><text x="462" y="404" font-size="19">16 judgments at once,</text><text x="462" y="427" font-size="19">not 16 measurements</text></g><g class="cb" style="animation-delay:0.86s"><polygon points="438.0,462.0 748.0,462.0 748.0,592.0 438.0,592.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="748.0,462.0 762.0,448.0 762.0,578.0 748.0,592.0" fill="#1a7f37" stroke="#00000022" stroke-width=".6"/><polygon points="438.0,462.0 452.0,448.0 762.0,448.0 748.0,462.0" fill="#6fdc8c" stroke="#00000022" stroke-width=".6"/><rect x="438" y="462" width="310" height="130" fill="#ffffff" stroke="#cbdcf0"/><rect x="438" y="462" width="8" height="130" fill="#2da44e"/><text x="462" y="504" font-size="30" class="b">Rebuild</text><text class="mono" x="462" y="532" font-size="19">gel-structural</text><text x="462" y="560" font-size="19">XOR; a wrong parent</text><text x="462" y="583" font-size="19">is not detected</text></g><g class="cb" style="animation-delay:1.08s"><polygon points="836.0,462.0 1146.0,462.0 1146.0,592.0 836.0,592.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="1146.0,462.0 1160.0,448.0 1160.0,578.0 1146.0,592.0" fill="#1a7f37" stroke="#00000022" stroke-width=".6"/><polygon points="836.0,462.0 850.0,448.0 1160.0,448.0 1146.0,462.0" fill="#6fdc8c" stroke="#00000022" stroke-width=".6"/><rect x="836" y="462" width="310" height="130" fill="#ffffff" stroke="#cbdcf0"/><rect x="836" y="462" width="8" height="130" fill="#2da44e"/><text x="860" y="504" font-size="30" class="b">History</text><text class="mono" x="860" y="532" font-size="19">gel-history</text><text x="860" y="560" font-size="19">copy or XOR difference</text><text x="860" y="583" font-size="19">rebuilt bit for bit</text></g><g class="cb" style="animation-delay:1.30s"><polygon points="836.0,150.0 1146.0,150.0 1146.0,280.0 836.0,280.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="1146.0,150.0 1160.0,136.0 1160.0,266.0 1146.0,280.0" fill="#9a6700" stroke="#00000022" stroke-width=".6"/><polygon points="836.0,150.0 850.0,136.0 1160.0,136.0 1146.0,150.0" fill="#ffd46b" stroke="#00000022" stroke-width=".6"/><rect x="836" y="150" width="310" height="130" fill="#ffffff" stroke="#cbdcf0"/><rect x="836" y="150" width="8" height="130" fill="#d4a72c"/><text x="860" y="192" font-size="30" class="b">Q8 record</text><text class="mono" x="860" y="220" font-size="19">gel-phase-quad</text><text x="860" y="248" font-size="19">one 1,152-byte record</text><text x="860" y="271" font-size="19">four equivalent views</text></g><g class="cb" style="animation-delay:1.52s"><polygon points="836.0,306.0 1146.0,306.0 1146.0,436.0 836.0,436.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="1146.0,306.0 1160.0,292.0 1160.0,422.0 1146.0,436.0" fill="#6639ba" stroke="#00000022" stroke-width=".6"/><polygon points="836.0,306.0 850.0,292.0 1160.0,292.0 1146.0,306.0" fill="#c297ff" stroke="#00000022" stroke-width=".6"/><rect x="836" y="306" width="310" height="130" fill="#ffffff" stroke="#cbdcf0"/><rect x="836" y="306" width="8" height="130" fill="#8250df"/><text x="860" y="348" font-size="30" class="b">Memory cost</text><text class="mono" x="860" y="376" font-size="19">gel-physics</text><text x="860" y="404" font-size="19">latency and bandwidth</text><text x="860" y="427" font-size="19">of your own RAM</text></g><path class="cf" style="animation-delay:0.87s" d="M366.0 371.0C396.0 371.0 396.0 215.0 426.0 215.0" pathLength="100" fill="none" stroke="#486380" stroke-width="2.6"/><polygon class="ch" style="animation-delay:1.27s" points="426.0,208.0 436.0,215.0 426.0,222.0" fill="#486380"/><path class="cf" style="animation-delay:1.09s" d="M366.0 371.0H426.0" pathLength="100" fill="none" stroke="#486380" stroke-width="2.6"/><polygon class="ch" style="animation-delay:1.49s" points="426.0,364.0 436.0,371.0 426.0,378.0" fill="#486380"/><path class="cf" style="animation-delay:1.31s" d="M366.0 371.0C396.0 371.0 396.0 527.0 426.0 527.0" pathLength="100" fill="none" stroke="#486380" stroke-width="2.6"/><polygon class="ch" style="animation-delay:1.71s" points="426.0,520.0 436.0,527.0 426.0,534.0" fill="#486380"/><path class="cf" style="animation-delay:1.53s" d="M195.0 438.0V622.0H991.0V604.0" pathLength="100" fill="none" stroke="#486380" stroke-width="2.6"/><polygon class="ch" style="animation-delay:1.93s" points="984.0,604.0 991.0,594.0 998.0,604.0" fill="#486380"/><path class="cf" style="animation-delay:1.53s" d="M764.0 527.0H824.0" pathLength="100" fill="none" stroke="#486380" stroke-width="2.6"/><polygon class="ch" style="animation-delay:1.93s" points="824.0,520.0 834.0,527.0 824.0,534.0" fill="#486380"/><path class="cp" style="animation-delay:2.34s" d="M366.0 371.0C396.0 371.0 396.0 215.0 426.0 215.0" pathLength="100" fill="none" stroke-width="7" stroke-linecap="round"/><rect class="cg" style="animation-delay:2.99s" x="432.0" y="130.0" width="336.0" height="156.0" rx="8" fill="none" stroke-width="3"/><path class="cp" style="animation-delay:2.34s" d="M366.0 371.0H426.0" pathLength="100" fill="none" stroke-width="7" stroke-linecap="round"/><rect class="cg" style="animation-delay:2.99s" x="432.0" y="286.0" width="336.0" height="156.0" rx="8" fill="none" stroke-width="3"/><path class="cp" style="animation-delay:2.34s" d="M366.0 371.0C396.0 371.0 396.0 527.0 426.0 527.0" pathLength="100" fill="none" stroke-width="7" stroke-linecap="round"/><rect class="cg" style="animation-delay:2.99s" x="432.0" y="442.0" width="336.0" height="156.0" rx="8" fill="none" stroke-width="3"/><path class="cp" style="animation-delay:2.34s" d="M195.0 438.0V622.0H991.0V604.0" pathLength="100" fill="none" stroke-width="7" stroke-linecap="round"/><rect class="cg" style="animation-delay:2.99s" x="830.0" y="442.0" width="336.0" height="156.0" rx="8" fill="none" stroke-width="3"/><path class="cp" style="animation-delay:3.14s" d="M764.0 527.0H824.0" pathLength="100" fill="none" stroke-width="7" stroke-linecap="round"/><rect class="cg" style="animation-delay:3.79s" x="830.0" y="442.0" width="336.0" height="156.0" rx="8" fill="none" stroke-width="3"/>
</svg>
