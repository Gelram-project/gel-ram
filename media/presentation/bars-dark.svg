<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Format mutation matrix</title>
<desc id="d">179 byte-level mutants of the three public formats, each read with the original pin and with a recomputed one. In the committed report 358 of 358 rows matched their expected verdict: 331 rejected, 27 accepted as documented.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.bar{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}.num{animation:fade .8s ease-out both}@keyframes grow{from{transform:scaleY(0)}to{transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@media (prefers-reduced-motion:reduce){.bar,.num{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="378" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="378" rx="24" fill="url(#bg)" stroke="#30465f"/>
