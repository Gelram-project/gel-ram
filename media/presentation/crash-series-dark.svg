<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
<title id="t">Kill it while it writes</title>
<desc id="d">Kill it while it writes: 200 trials of the public tool killed at random moments while it writes; 2,683 acknowledged snapshots, 0 lost, 0 partial, 200 of 200 resumed. A process kill is not a power cut.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.mut{fill:#9fb3c8}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="228" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="228" rx="24" fill="url(#bg)" stroke="#30465f"/>
<rect x="20" y="20" width="1160" height="190" rx="16" fill="#101d31" fill-opacity=".6" stroke="#30465f"/><text class="kick" x="44" y="56">KILL IT WHILE IT WRITES · PUBLIC TOOL · ANYONE CAN RUN IT</text><text x="44" y="118" font-size="44" class="b" style="fill:#e6edf3">200</text><text x="44" y="144" font-size="14" class="mut">trials</text><text x="184" y="118" font-size="44" class="b" style="fill:#e6edf3">2,683</text><text x="184" y="144" font-size="14" class="mut">acknowledged snapshots</text><text x="424" y="118" font-size="44" class="b" style="fill:#56d364">0</text><text x="424" y="144" font-size="14" class="mut">lost</text><text x="514" y="118" font-size="44" class="b" style="fill:#56d364">0</text><text x="514" y="144" font-size="14" class="mut">partial</text><text x="624" y="118" font-size="44" class="b" style="fill:#56d364">200/200</text><text x="624" y="144" font-size="14" class="mut">resumed</text><text x="1156" y="100" font-size="17" class="b" text-anchor="end">Restart. Verify. Continue.</text><text x="1156" y="130" font-size="17" class="b" text-anchor="end" style="fill:#e3b341">PROCESS KILL IS NOT POWER LOSS</text><text x="44" y="188" font-size="13" class="mut">SIGKILL at seeded random moments while a collection grows; every acknowledged snapshot must reload exactly, none may be partial.</text>
</svg>
