<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="574" viewBox="0 0 1200 574" role="img" aria-labelledby="t d">
<title id="t">The same 133 cases, timed twice</title>
<desc id="d">The same 133 cases, timed twice against v0.6.1, each against its own A/A band: 103 faster, 12 inside, 18 slower on 2026-10-20; 105 faster, 4 inside, 24 slower on 2026-11-04; 100 of the 103 faster again (102 with a ratio above 1). A/A noise 0.04 → 0.004. One machine, not pinned to cores.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}.rn-g{animation:rn-grow 1s cubic-bezier(.2,.8,.2,1) both;transform-box:view-box;transform-origin:236px 0}.rn-f{animation:rn-fade .6s ease-out both}.rn-p{animation:rn-pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}.rn-d{animation:rn-drop .6s ease-out 1.7s both,rn-glow 1.8s ease-in-out 2.4s 3 both;transform-box:fill-box;transform-origin:top}@keyframes rn-grow{from{transform:scaleX(0)}to{transform:none}}@keyframes rn-fade{from{opacity:0}to{opacity:1}}@keyframes rn-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes rn-drop{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}@keyframes rn-glow{0%,100%{fill-opacity:.18}50%{fill-opacity:.34}}@media (prefers-reduced-motion:reduce){.rn-g,.rn-f,.rn-p,.rn-d{animation:none}}
</style>
