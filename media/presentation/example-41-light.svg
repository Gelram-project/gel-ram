xt><text x="634" y="220" font-size="15">Because the sitting MP died.</text><text x="634" y="280" font-size="17" class="b">Qwen3.8-27B</text><rect x="1060" y="263" width="96" height="24" rx="12" fill="#b3242a"/><text x="1108" y="279" font-size="12" class="b" text-anchor="middle" style="fill:#ffffff" letter-spacing="1">WRONG</text><text x="634" y="308" font-size="15">The death of the sitting Member of Parliament.</text><text x="634" y="392" font-size="14" class="mut">All three give a reason the source does not give.</text><text x="634" y="414" font-size="14" class="mut">GEL returns the passage that states it.</text>
