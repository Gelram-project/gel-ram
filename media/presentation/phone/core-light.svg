<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1196" viewBox="0 0 600 1196" role="img" aria-labelledby="t d">
<title id="t">The memory core</title>
<desc id="d">The 7 parts of the memory core and the 5 dependencies their Cargo.toml files declare among them: Store, Reader and Rebuild build on Bit record; History builds on Bit record and Rebuild. Q8 record and Memory cost stand alone.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#0969da}
.big{fill:#0969da;font-weight:700}.pb{animation:cph-in .55s cubic-bezier(.2,.8,.2,1) both}.pn{animation:cph-in .6s ease-out both}.pa{animation:cph-draw .5s ease-out both}.ph,.px{animation:cph-fade .5s ease-out both}.pp{animation:cph-run .9s ease-in-out both}@keyframes cph-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes cph-draw{from{stroke-dasharray:100 100;stroke-dashoffset:100}to{stroke-dasharray:100 100;stroke-dashoffset:0}}@keyframes cph-fade{from{opacity:0}to{opacity:1}}@keyframes cph-run{from{stroke:#0969da;stroke-dasharray:12 200;stroke-dashoffset:20}to{stroke:#0969da;stroke-dasharray:12 200;stroke-dashoffset:-110}}@media (prefers-reduced-motion:reduce){.pb,.pn,.pa,.ph,.px,.pp{animation:none}}.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="1194" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="1194" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="52">THE MEMORY CORE</text><g class="pn" style="animation-delay:.05s"><text x="40" y="128" font-size="64" class="big">7</text><text x="40" y="162" font-size="24" class="mut">parts</text></g><g class="pn" style="animation-delay:.2s"><text x="300" y="128" font-size="64" class="big">5</text><text x="300" y="162" font-size="24" class="mut">dependencies</text></g><text x="40" y="212" font-size="20" class="mut">Arrow A → B: B builds on A,</text><text x="40" y="240" font-size="20" class="mut">as its Cargo.toml says</text><g class="px" style="animation-delay:1.25s"><rect x="88.0" y="872.0" width="496.0" height="294.0" rx="18" fill="#0969da" fill-opacity=".05" stroke="#486380" stroke-width="2" stroke-dasharray="7 6"/><text x="110.0" y="906.0" font-size="22" class="b mut">stand alone</text></g><g class="pb" style="animation-delay:0.45s"><polygon points="104.0,284.0 560.0,284.0 560.0,384.0 104.0,384.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,284.0 572.0,272.0 572.0,372.0 560.0,384.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,284.0 116.0,272.0 572.0,272.0 560.0,284.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="284" width="456" height="100" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="284" width="8" height="100" fill="#2f7fe0"/><text x="126.0" y="320.0" font-size="26" class="b">Bit record</text><text class="mono" x="544.0" y="320.0" font-size="20" text-anchor="end">gel-orb</text><text x="126.0" y="350.0" font-size="20">128 bytes, 1,024 bits</text><text x="126.0" y="374.0" font-size="20">round-trip exactly</text></g><g class="pb" style="animation-delay:0.61s"><polygon points="104.0,400.0 560.0,400.0 560.0,500.0 104.0,500.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,400.0 572.0,388.0 572.0,488.0 560.0,500.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,400.0 116.0,388.0 572.0,388.0 560.0,400.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="400" width="456" height="100" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="400" width="8" height="100" fill="#2f7fe0"/><text x="126.0" y="436.0" font-size="26" class="b">Store</text><text class="mono" x="544.0" y="436.0" font-size="20" text-anchor="end">gel-store</text><text x="126.0" y="466.0" font-size="20">CRC64 over header</text><text x="126.0" y="490.0" font-size="20">and over payload</text></g><g class="pb" style="animation-delay:0.77s"><polygon points="104.0,516.0 560.0,516.0 560.0,616.0 104.0,616.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,516.0 572.0,504.0 572.0,604.0 560.0,616.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,516.0 116.0,504.0 572.0,504.0 560.0,516.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="516" width="456" height="100" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="516" width="8" height="100" fill="#2f7fe0"/><text x="126.0" y="552.0" font-size="26" class="b">Reader</text><text class="mono" x="544.0" y="552.0" font-size="20" text-anchor="end">gel-reader</text><text x="126.0" y="582.0" font-size="20">16 judgments at once,</text><text x="126.0" y="606.0" font-size="20">not 16 measurements</text></g><g class="pb" style="animation-delay:0.93s"><polygon points="104.0,632.0 560.0,632.0 560.0,732.0 104.0,732.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,632.0 572.0,620.0 572.0,720.0 560.0,732.0" fill="#1a7f37" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,632.0 116.0,620.0 572.0,620.0 560.0,632.0" fill="#6fdc8c" stroke="#00000022" stroke-width=".6"/><rect x="104" y="632" width="456" height="100" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="632" width="8" height="100" fill="#2da44e"/><text x="126.0" y="668.0" font-size="26" class="b">Rebuild</text><text class="mono" x="544.0" y="668.0" font-size="20" text-anchor="end">gel-structural</text><text x="126.0" y="698.0" font-size="20">XOR; a wrong parent</text><text x="126.0" y="722.0" font-size="20">is not detected</text></g><g class="pb" style="animation-delay:1.09s"><polygon points="104.0,748.0 560.0,748.0 560.0,848.0 104.0,848.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,748.0 572.0,736.0 572.0,836.0 560.0,848.0" fill="#1a7f37" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,748.0 116.0,736.0 572.0,736.0 560.0,748.0" fill="#6fdc8c" stroke="#00000022" stroke-width=".6"/><rect x="104" y="748" width="456" height="100" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="748" width="8" height="100" fill="#2da44e"/><text x="126.0" y="784.0" font-size="26" class="b">History</text><text class="mono" x="544.0" y="784.0" font-size="20" text-anchor="end">gel-history</text><text x="126.0" y="814.0" font-size="20">copy or XOR difference</text><text x="126.0" y="838.0" font-size="20">rebuilt bit for bit</text></g><g class="pb" style="animation-delay:1.25s"><polygon points="104.0,934.0 560.0,934.0 560.0,1034.0 104.0,1034.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,934.0 572.0,922.0 572.0,1022.0 560.0,1034.0" fill="#9a6700" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,934.0 116.0,922.0 572.0,922.0 560.0,934.0" fill="#ffd46b" stroke="#00000022" stroke-width=".6"/><rect x="104" y="934" width="456" height="100" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="934" width="8" height="100" fill="#d4a72c"/><text x="126.0" y="970.0" font-size="26" class="b">Q8 record</text><text class="mono" x="544.0" y="970.0" font-size="20" text-anchor="end">gel-phase-quad</text><text x="126.0" y="1000.0" font-size="20">one 1,152-byte record</text><text x="126.0" y="1024.0" font-size="20">four equivalent views</text></g><g class="pb" style="animation-delay:1.41s"><polygon points="104.0,1050.0 560.0,1050.0 560.0,1150.0 104.0,1150.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,1050.0 572.0,1038.0 572.0,1138.0 560.0,1150.0" fill="#6639ba" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,1050.0 116.0,1038.0 572.0,1038.0 560.0,1050.0" fill="#c297ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="1050" width="456" height="100" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="1050" width="8" height="100" fill="#8250df"/><text x="126.0" y="1086.0" font-size="26" class="b">Memory cost</text><text class="mono" x="544.0" y="1086.0" font-size="20" text-anchor="end">gel-physics</text><text x="126.0" y="1116.0" font-size="20">latency and bandwidth</text><text x="126.0" y="1140.0" font-size="20">of your own RAM</text></g><path class="pa" style="animation-delay:1.06s" d="M103.0 364.0C71.0 364.0 71.0 450.0 89.0 450.0" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.46s" points="88.0,443.0 103.0,450.0 88.0,457.0" fill="#486380"/><path class="pa" style="animation-delay:1.22s" d="M103.0 344.0C54.0 344.0 54.0 566.0 89.0 566.0" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.62s" points="88.0,559.0 103.0,566.0 88.0,573.0" fill="#486380"/><path class="pa" style="animation-delay:1.38s" d="M103.0 324.0C37.0 324.0 37.0 665.3 89.0 665.3" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.78s" points="88.0,658.3 103.0,665.3 88.0,672.3" fill="#486380"/><path class="pa" style="animation-delay:1.54s" d="M103.0 304.0C20.0 304.0 20.0 814.7 89.0 814.7" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.94s" points="88.0,807.7 103.0,814.7 88.0,821.7" fill="#486380"/><path class="pa" style="animation-delay:1.54s" d="M103.0 698.7C71.0 698.7 71.0 781.3 89.0 781.3" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.94s" points="88.0,774.3 103.0,781.3 88.0,788.3" fill="#486380"/><path class="pp" style="animation-delay:2.07s" d="M103.0 364.0C71.0 364.0 71.0 450.0 89.0 450.0" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.07s" d="M103.0 344.0C54.0 344.0 54.0 566.0 89.0 566.0" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.07s" d="M103.0 324.0C37.0 324.0 37.0 665.3 89.0 665.3" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.07s" d="M103.0 304.0C20.0 304.0 20.0 814.7 89.0 814.7" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.77s" d="M103.0 698.7C71.0 698.7 71.0 781.3 89.0 781.3" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/>
</svg>
