<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="t d">
<title id="t">The memory core</title>
<desc id="d">The 7 parts of the memory core and the 5 dependencies their Cargo.toml files declare among them: Store, Reader and Rebuild build on Bit record; History builds on Bit record and Rebuild. Q8 record and Memory cost stand alone.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#0969da}
.big{fill:#0969da;font-weight:700}.pb{animation:cph-in .55s cubic-bezier(.2,.8,.2,1) both}.pn{animation:cph-in .6s ease-out both}.pa{animation:cph-draw .5s ease-out both}.ph,.px{animation:cph-fade .5s ease-out both}.pp{animation:cph-run .9s ease-in-out both}@keyframes cph-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes cph-draw{from{stroke-dasharray:100 100;stroke-dashoffset:100}to{stroke-dasharray:100 100;stroke-dashoffset:0}}@keyframes cph-fade{from{opacity:0}to{opacity:1}}@keyframes cph-run{from{stroke:#0969da;stroke-dasharray:12 200;stroke-dashoffset:20}to{stroke:#0969da;stroke-dasharray:12 200;stroke-dashoffset:-110}}@media (prefers-reduced-motion:reduce){.pb,.pn,.pa,.ph,.px,.pp{animation:none}}.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="848" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="848" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="44">THE MEMORY CORE</text><g class="pn" style="animation-delay:.05s"><text x="40" y="104" font-size="52" class="big">7</text><text x="82.2" y="104" font-size="24" class="mut">parts</text></g><g class="pn" style="animation-delay:.2s"><text x="240" y="104" font-size="52" class="big">5</text><text x="282.2" y="104" font-size="24" class="mut">dependencies</text></g><text x="40" y="140" font-size="20" class="mut">Arrow A → B: B builds on A,</text><text x="40" y="166" font-size="20" class="mut">as its Cargo.toml says</text><g class="px" style="animation-delay:1.25s"><rect x="88.0" y="614.0" width="489.0" height="218.0" rx="16" fill="#0969da" fill-opacity=".05" stroke="#486380" stroke-width="2" stroke-dasharray="7 6"/><text x="110.0" y="642.0" font-size="20" class="b mut">stand alone</text></g><g class="pb" style="animation-delay:0.45s"><polygon points="104.0,186.0 560.0,186.0 560.0,264.0 104.0,264.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,186.0 565.0,181.0 565.0,259.0 560.0,264.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,186.0 109.0,181.0 565.0,181.0 560.0,186.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="186" width="456" height="78" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="186" width="8" height="78" fill="#2f7fe0"/><text x="126.0" y="211.0" font-size="24" class="b">Bit record</text><text class="mono" x="544.0" y="211.0" font-size="20" text-anchor="end">gel-orb</text><text x="126.0" y="235.0" font-size="20">128 bytes, 1,024 bits</text><text x="126.0" y="257.0" font-size="20">round-trip exactly</text></g><g class="pb" style="animation-delay:0.61s"><polygon points="104.0,270.0 560.0,270.0 560.0,348.0 104.0,348.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,270.0 565.0,265.0 565.0,343.0 560.0,348.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,270.0 109.0,265.0 565.0,265.0 560.0,270.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="270" width="456" height="78" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="270" width="8" height="78" fill="#2f7fe0"/><text x="126.0" y="295.0" font-size="24" class="b">Store</text><text class="mono" x="544.0" y="295.0" font-size="20" text-anchor="end">gel-store</text><text x="126.0" y="319.0" font-size="20">CRC64 over header</text><text x="126.0" y="341.0" font-size="20">and over payload</text></g><g class="pb" style="animation-delay:0.77s"><polygon points="104.0,354.0 560.0,354.0 560.0,432.0 104.0,432.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,354.0 565.0,349.0 565.0,427.0 560.0,432.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,354.0 109.0,349.0 565.0,349.0 560.0,354.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="354" width="456" height="78" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="354" width="8" height="78" fill="#2f7fe0"/><text x="126.0" y="379.0" font-size="24" class="b">Reader</text><text class="mono" x="544.0" y="379.0" font-size="20" text-anchor="end">gel-reader</text><text x="126.0" y="403.0" font-size="20">16 judgments at once,</text><text x="126.0" y="425.0" font-size="20">not 16 measurements</text></g><g class="pb" style="animation-delay:0.93s"><polygon points="104.0,438.0 560.0,438.0 560.0,516.0 104.0,516.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,438.0 565.0,433.0 565.0,511.0 560.0,516.0" fill="#1a7f37" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,438.0 109.0,433.0 565.0,433.0 560.0,438.0" fill="#6fdc8c" stroke="#00000022" stroke-width=".6"/><rect x="104" y="438" width="456" height="78" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="438" width="8" height="78" fill="#2da44e"/><text x="126.0" y="463.0" font-size="24" class="b">Rebuild</text><text class="mono" x="544.0" y="463.0" font-size="20" text-anchor="end">gel-structural</text><text x="126.0" y="487.0" font-size="20">XOR; a wrong parent</text><text x="126.0" y="509.0" font-size="20">is not detected</text></g><g class="pb" style="animation-delay:1.09s"><polygon points="104.0,522.0 560.0,522.0 560.0,600.0 104.0,600.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,522.0 565.0,517.0 565.0,595.0 560.0,600.0" fill="#1a7f37" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,522.0 109.0,517.0 565.0,517.0 560.0,522.0" fill="#6fdc8c" stroke="#00000022" stroke-width=".6"/><rect x="104" y="522" width="456" height="78" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="522" width="8" height="78" fill="#2da44e"/><text x="126.0" y="547.0" font-size="24" class="b">History</text><text class="mono" x="544.0" y="547.0" font-size="20" text-anchor="end">gel-history</text><text x="126.0" y="571.0" font-size="20">copy or XOR difference</text><text x="126.0" y="593.0" font-size="20">rebuilt bit for bit</text></g><g class="pb" style="animation-delay:1.25s"><polygon points="104.0,658.0 560.0,658.0 560.0,736.0 104.0,736.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,658.0 565.0,653.0 565.0,731.0 560.0,736.0" fill="#9a6700" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,658.0 109.0,653.0 565.0,653.0 560.0,658.0" fill="#ffd46b" stroke="#00000022" stroke-width=".6"/><rect x="104" y="658" width="456" height="78" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="658" width="8" height="78" fill="#d4a72c"/><text x="126.0" y="683.0" font-size="24" class="b">Q8 record</text><text class="mono" x="544.0" y="683.0" font-size="20" text-anchor="end">gel-phase-quad</text><text x="126.0" y="707.0" font-size="20">one 1,152-byte record</text><text x="126.0" y="729.0" font-size="20">four equivalent views</text></g><g class="pb" style="animation-delay:1.41s"><polygon points="104.0,742.0 560.0,742.0 560.0,820.0 104.0,820.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="560.0,742.0 565.0,737.0 565.0,815.0 560.0,820.0" fill="#6639ba" stroke="#00000022" stroke-width=".6"/><polygon points="104.0,742.0 109.0,737.0 565.0,737.0 560.0,742.0" fill="#c297ff" stroke="#00000022" stroke-width=".6"/><rect x="104" y="742" width="456" height="78" fill="#ffffff" stroke="#cbdcf0"/><rect x="104" y="742" width="8" height="78" fill="#8250df"/><text x="126.0" y="767.0" font-size="24" class="b">Memory cost</text><text class="mono" x="544.0" y="767.0" font-size="20" text-anchor="end">gel-physics</text><text x="126.0" y="791.0" font-size="20">latency and bandwidth</text><text x="126.0" y="813.0" font-size="20">of your own RAM</text></g><path class="pa" style="animation-delay:1.06s" d="M103.0 248.4C71.0 248.4 71.0 309.0 89.0 309.0" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.46s" points="88.0,302.0 103.0,309.0 88.0,316.0" fill="#486380"/><path class="pa" style="animation-delay:1.22s" d="M103.0 232.8C54.0 232.8 54.0 393.0 89.0 393.0" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.62s" points="88.0,386.0 103.0,393.0 88.0,400.0" fill="#486380"/><path class="pa" style="animation-delay:1.38s" d="M103.0 217.2C37.0 217.2 37.0 464.0 89.0 464.0" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.78s" points="88.0,457.0 103.0,464.0 88.0,471.0" fill="#486380"/><path class="pa" style="animation-delay:1.54s" d="M103.0 201.6C20.0 201.6 20.0 574.0 89.0 574.0" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.94s" points="88.0,567.0 103.0,574.0 88.0,581.0" fill="#486380"/><path class="pa" style="animation-delay:1.54s" d="M103.0 490.0C71.0 490.0 71.0 548.0 89.0 548.0" pathLength="100" fill="none" stroke="#486380" stroke-width="3"/><polygon class="ph" style="animation-delay:1.94s" points="88.0,541.0 103.0,548.0 88.0,555.0" fill="#486380"/><path class="pp" style="animation-delay:2.07s" d="M103.0 248.4C71.0 248.4 71.0 309.0 89.0 309.0" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.07s" d="M103.0 232.8C54.0 232.8 54.0 393.0 89.0 393.0" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.07s" d="M103.0 217.2C37.0 217.2 37.0 464.0 89.0 464.0" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.07s" d="M103.0 201.6C20.0 201.6 20.0 574.0 89.0 574.0" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/><path class="pp" style="animation-delay:2.77s" d="M103.0 490.0C71.0 490.0 71.0 548.0 89.0 548.0" pathLength="100" fill="none" stroke-width="6" stroke-linecap="round"/>
</svg>
