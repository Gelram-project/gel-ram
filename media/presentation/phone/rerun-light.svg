<svg xmlns="http://www.w3.org/2000/svg" width="600" height="696" viewBox="0 0 600 696" role="img" aria-labelledby="t d">
<title id="t">The same 133 cases, timed twice</title>
<desc id="d">The same 133 cases, timed twice against v0.6.1, each against its own A/A band: 103 faster, 12 inside, 18 slower on 2026-10-20; 105 faster, 4 inside, 24 slower on 2026-11-04; 100 of the 103 faster again (102 with a ratio above 1). A/A noise 0.04 → 0.004. One machine, not pinned to cores.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}.rph-f{animation:rph-fade .7s ease-out both}.rph-g{animation:rph-grow 1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}.rph-p{animation:rph-pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}.rph-u{animation:rph-rise .8s cubic-bezier(.2,.8,.2,1) both}@keyframes rph-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes rph-grow{from{transform:scaleX(0)}to{transform:none}}@keyframes rph-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes rph-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.rph-f,.rph-g,.rph-p,.rph-u{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="694" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="694" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="48">RE-RUN · 2026-10-20 → 2026-11-04</text><g class="rph-f"><text x="40" y="96" font-size="36" class="b">The same 133 cases</text><text x="40" y="128" font-size="22">timed twice against v0.6.1</text><text x="40" y="156" font-size="20" class="mut">each case against its own A/A band</text></g><text class="rph-f" style="animation-delay:0.3s" x="40" y="188" font-size="22"><tspan class="b">2026-10-20</tspan><tspan class="mut"> · recorded</tspan></text><g class="rph-g" style="animation-delay:0.3s"><rect x="40.0" y="200" width="402.7" height="36" fill="#2f7fe0"/><rect x="442.7" y="200" width="46.9" height="36" fill="#6e7781"/><rect x="489.6" y="200" width="70.4" height="36" fill="#e5484d"/><rect x="40" y="200" width="520" height="36" rx="3" fill="none" stroke="#cbdcf0"/></g><text class="rph-f" style="animation-delay:0.7s" x="40" y="352" font-size="22"><tspan class="b">2026-11-04</tspan><tspan class="mut"> · re-run</tspan></text><g class="rph-g" style="animation-delay:0.7s"><rect x="40.0" y="288" width="410.5" height="36" fill="#2f7fe0"/><rect x="450.5" y="288" width="15.6" height="36" fill="#6e7781"/><rect x="466.2" y="288" width="93.8" height="36" fill="#e5484d"/><rect x="40" y="288" width="520" height="36" rx="3" fill="none" stroke="#cbdcf0"/></g><rect class="rph-f" style="animation-delay:1.3s" x="40" y="236" width="391.0" height="52" fill="#0969da" fill-opacity=".18"/><path class="rph-f" style="animation-delay:1.3s" d="M40 236V288M431.0 236V288" stroke="#0969da" stroke-width="2.5" stroke-dasharray="6 5"/><g class="rph-p" style="animation-delay:1.6s"><rect x="52.1" y="243" width="367" height="38" rx="19" fill="#0969da"/><text x="235.5" y="270" font-size="22" class="b" text-anchor="middle" style="fill:#ffffff">100 of 103 faster again</text></g><path class="rph-f" style="animation-delay:1.8s" d="M40 404H560" stroke="#cbdcf0" stroke-width="1.5"/><g class="rph-f" style="animation-delay:1.8s"><text x="330" y="392" font-size="22" class="b" text-anchor="end" style="fill:#2f7fe0">faster</text><text x="445" y="392" font-size="22" class="b" text-anchor="end" style="fill:#486380">inside</text><text x="560" y="392" font-size="22" class="b" text-anchor="end" style="fill:#e5484d">slower</text><text class="mono" x="40" y="438" font-size="22">2026-10-20</text><text x="330" y="438" font-size="30" class="b" text-anchor="end">103</text><text x="445" y="438" font-size="30" class="b" text-anchor="end">12</text><text x="560" y="438" font-size="30" class="b" text-anchor="end">18</text><text class="mono" x="40" y="476" font-size="22">2026-11-04</text><text x="330" y="476" font-size="30" class="b" text-anchor="end">105</text><text x="445" y="476" font-size="30" class="b" text-anchor="end">4</text><text x="560" y="476" font-size="30" class="b" text-anchor="end">24</text></g><text class="rph-f mut" style="animation-delay:2.0s" x="40" y="510" font-size="20">102 of the 103 with a ratio above 1</text><g class="rph-f" style="animation-delay:2.2s"><text x="40" y="556" font-size="26" class="b">A/A noise</text><text x="40" y="584" font-size="20" class="mut">median |aa - 1| of each run</text></g><text class="rph-p b" style="animation-delay:2.4s" x="560" y="562" font-size="36" text-anchor="end">0.04 → 0.004</text><g class="rph-f" style="animation-delay:2.7s"><text x="40" y="622" font-size="20" class="mut">One machine, not pinned to cores</text><text x="40" y="648" font-size="20" class="mut">A, A2: two checkouts of v0.6.1</text><text x="40" y="674" font-size="20" class="mut">B: main at 876247f</text></g>
</svg>
