<svg xmlns="http://www.w3.org/2000/svg" width="600" height="604" viewBox="0 0 600 604" role="img" aria-labelledby="t d">
<title id="t">Versions 0.8 and 0.9 at a glance</title>
<desc id="d">Versions 0.8 and 0.9 at a glance. New in 0.9: 20 fault tests of saved files, no power-loss test; 72 memory samples of 8 operations, one machine, process-wide, no time; 6 steps of xtask witness on any host, one block. Since 0.8: 8 tool programs answer --version and --license.</desc>
