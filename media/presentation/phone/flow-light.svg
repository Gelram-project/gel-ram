<svg xmlns="http://www.w3.org/2000/svg" width="600" height="574" viewBox="0 0 600 574" role="img" aria-labelledby="t d">
<title id="t">What happens to a citation</title>
<desc id="d">Animated illustration: a document with a highlighted exact quote becomes a snapshot pinned by SHA-256; a new process reopens it with the same pin and passes; a copy with one changed byte is refused. Drawn, not recorded; not a timing measurement.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}.fq-c{transform-box:fill-box;transform-origin:center}.fq0{animation:fq-hot 1s ease-in-out 4.6s 6 alternate both}.fq1{animation:fq-flow 1s linear infinite}.fq2{animation:fq-in .5s ease-out .9s both}.fq3{animation:fq-in .5s ease-out 2s both}.fq4{animation:fq-in .5s ease-out 3s both}.fq5{animation:fq-drop .6s cubic-bezier(.2,.8,.2,1) .2s both}.fq6{animation:fq-pop .6s cubic-bezier(.2,.8,.2,1) 1.3s both}.fq7{animation:fq-drop .6s cubic-bezier(.2,.8,.2,1) 2.4s both}.fq8{animation:fq-drop .6s cubic-bezier(.2,.8,.2,1) 3.4s both,fq-shake .5s ease-in-out 4.1s both}@media (prefers-reduced-motion:reduce){.fq0,.fq1,.fq2,.fq3,.fq4,.fq5,.fq6,.fq7,.fq8{animation:none}}@keyframes fq-in{from{opacity:0}to{opacity:1}}@keyframes fq-drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}@keyframes fq-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}@keyframes fq-shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}@keyframes fq-hot{from{opacity:1}to{opacity:.35}}@keyframes fq-flow{to{stroke-dashoffset:-36}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="572" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="572" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="48">WHAT HAPPENS TO A CITATION</text><g class="fq2"><path class="fq1" d="M100 144V161" stroke="#0969da" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/><path d="M100 169l-7 -11h14z" fill="#0969da"/></g><g class="fq3"><path class="fq1" d="M100 250V267" stroke="#0969da" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/><path d="M100 275l-7 -11h14z" fill="#0969da"/></g><g class="fq4"><path class="fq1" d="M58 212C14 212 14 424 46 424" stroke="#0969da" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/><path d="M60 424l-13 -8v16z" fill="#0969da"/></g><g class="fq-c fq5"><g><polygon points="72.0,86.0 132.0,86.0 132.0,148.0 72.0,148.0" fill="#dde7f3" stroke="#00000022" stroke-width=".6"/><polygon points="132.0,86.0 137.0,81.0 137.0,143.0 132.0,148.0" fill="#c3d2e6" stroke="#00000022" stroke-width=".6"/><polygon points="72.0,86.0 77.0,81.0 137.0,81.0 132.0,86.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="66.0,80.0 126.0,80.0 126.0,142.0 66.0,142.0" fill="#dde7f3" stroke="#00000022" stroke-width=".6"/><polygon points="126.0,80.0 131.0,75.0 131.0,137.0 126.0,142.0" fill="#c3d2e6" stroke="#00000022" stroke-width=".6"/><polygon points="66.0,80.0 71.0,75.0 131.0,75.0 126.0,80.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><polygon points="60.0,74.0 120.0,74.0 120.0,136.0 60.0,136.0" fill="#dde7f3" stroke="#00000022" stroke-width=".6"/><polygon points="120.0,74.0 125.0,69.0 125.0,131.0 120.0,136.0" fill="#c3d2e6" stroke="#00000022" stroke-width=".6"/><polygon points="60.0,74.0 65.0,69.0 125.0,69.0 120.0,74.0" fill="#ffffff" stroke="#00000022" stroke-width=".6"/><rect x="66" y="84" width="40" height="3" rx="2" fill="#9fbce0"/><rect x="66" y="94" width="48" height="7" rx="2" fill="#0969da"/><rect x="66" y="106" width="34" height="3" rx="2" fill="#9fbce0"/><rect x="66" y="116" width="31" height="3" rx="2" fill="#9fbce0"/><rect x="66" y="126" width="28" height="3" rx="2" fill="#9fbce0"/></g><text x="164" y="98" font-size="24" class="b">Your document</text><text x="164" y="126" font-size="20" class="mono">exact quote, bytes 67..105</text></g><g class="fq-c fq6"><g><polygon points="62.0,178.0 128.0,178.0 128.0,244.0 62.0,244.0" fill="#2f7fe0" stroke="#00000022" stroke-width=".6"/><polygon points="128.0,178.0 138.0,168.0 138.0,234.0 128.0,244.0" fill="#1f5fb0" stroke="#00000022" stroke-width=".6"/><polygon points="62.0,178.0 72.0,168.0 138.0,168.0 128.0,178.0" fill="#7db4ff" stroke="#00000022" stroke-width=".6"/><rect x="81" y="207" width="28" height="23" rx="4" fill="#ffffff" opacity=".92"/><path d="M88 207v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#ffffff" stroke-width="4" opacity=".92"/><circle cx="95" cy="219" r="3.5" fill="#1f5fb0"/></g><text x="164" y="204" font-size="24" class="b">Pinned snapshot</text><text x="164" y="232" font-size="20" class="mono">SHA-256 you keep</text></g><g class="fq-c fq7"><g><polygon points="64.0,286.0 126.0,286.0 126.0,348.0 64.0,348.0" fill="#2da44e" stroke="#00000022" stroke-width=".6"/><polygon points="126.0,286.0 136.0,276.0 136.0,338.0 126.0,348.0" fill="#1a7f37" stroke="#00000022" stroke-width=".6"/><polygon points="64.0,286.0 74.0,276.0 136.0,276.0 126.0,286.0" fill="#6fdc8c" stroke="#00000022" stroke-width=".6"/><path d="M79 317l10 10 19-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="164" y="310" font-size="24" class="b">Reopened</text><text x="399" y="310" font-size="24" class="b" style="fill:#1a7f37">PASS</text><text x="164" y="338" font-size="20" class="mono">new process, same pin</text></g><g class="fq-c fq8"><g><polygon points="64.0,392.0 126.0,392.0 126.0,454.0 64.0,454.0" fill="#e5484d" stroke="#00000022" stroke-width=".6"/><polygon points="126.0,392.0 136.0,382.0 136.0,444.0 126.0,454.0" fill="#b3242a" stroke="#00000022" stroke-width=".6"/><polygon points="64.0,392.0 74.0,382.0 136.0,382.0 126.0,392.0" fill="#ff9b93" stroke="#00000022" stroke-width=".6"/><rect x="69" y="397" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="69" y="410" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="69" y="424" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="69" y="438" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="82" y="397" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="82" y="410" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="82" y="424" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="82" y="438" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="96" y="397" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect class="fq0" x="96" y="410" width="12" height="12" rx="2" fill="#ffffff" opacity="1"/><rect x="96" y="424" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="96" y="438" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="110" y="397" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="110" y="410" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="110" y="424" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/><rect x="110" y="438" width="12" height="12" rx="2" fill="#ffffff" opacity=".22"/></g><text x="164" y="416" font-size="24" class="b">1 byte changed</text><text x="399" y="416" font-size="24" class="b" style="fill:#b3242a">REFUSED</text><text x="164" y="444" font-size="20" class="mono">copy with the old pin</text></g><text x="40" y="494" font-size="20" class="mut">Drawn, not recorded: the flow the six</text><text x="40" y="520" font-size="20" class="mut">recorded runs below show</text><text x="40" y="546" font-size="20" class="mut">not a timing measurement</text>
</svg>
