.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.mut{fill:#9fb3c8}.b{font-weight:700}.rph-f{animation:rph-fade .7s ease-out both}.rph-g{animation:rph-grow 1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}.rph-o{animation:rph-grow .9s cubic-bezier(.2,.8,.2,1) both;transform-box:view-box;transform-origin:0.0px 0}.rph-p{animation:rph-pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}.rph-u{animation:rph-rise .8s cubic-bezier(.2,.8,.2,1) both}@keyframes rph-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes rph-grow{from{transform:scaleX(0)}to{transform:none}}@keyframes rph-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes rph-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.rph-f,.rph-g,.rph-o,.rph-p,.rph-u{animation:none}}
</style>
