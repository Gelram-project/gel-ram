.mut{fill:#9fb3c8}.b{font-weight:700}.bph-f{animation:bph-fade .7s ease-out both}.bph-g{animation:bph-grow 1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}.bph-o{animation:bph-grow .9s cubic-bezier(.2,.8,.2,1) both;transform-box:view-box;transform-origin:0.0px 0}.bph-p{animation:bph-pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}.bph-u{animation:bph-rise .8s cubic-bezier(.2,.8,.2,1) both}@keyframes bph-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes bph-grow{from{transform:scaleX(0)}to{transform:none}}@keyframes bph-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes bph-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.bph-f,.bph-g,.bph-o,.bph-p,.bph-u{animation:none}}
</style>
