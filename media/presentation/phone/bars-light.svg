<svg xmlns="http://www.w3.org/2000/svg" width="600" height="702" viewBox="0 0 600 702" role="img" aria-labelledby="t d">
<title id="t">Format mutation matrix</title>
<desc id="d">179 byte-level mutants of the 3 public formats, each read with the original pin and with a recomputed one. In the committed report 358 of 358 rows matched their expected verdict: 331 rejected, 27 accepted as documented.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}.bph-f{animation:bph-fade .7s ease-out both}.bph-g{animation:bph-grow 1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}.bph-p{animation:bph-pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}.bph-u{animation:bph-rise .8s cubic-bezier(.2,.8,.2,1) both}@keyframes bph-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes bph-grow{from{transform:scaleX(0)}to{transform:none}}@keyframes bph-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes bph-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.bph-f,.bph-g,.bph-p,.bph-u{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="700" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="700" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
