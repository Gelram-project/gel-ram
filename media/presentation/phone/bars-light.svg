"20">53 rejected · 15 accepted</text><g class="bph-f" style="animation-delay:1.8s"><rect x="40" y="453" width="20" height="20" rx="4" fill="#e5484d"/><text x="72" y="470" font-size="20">rejected: 331</text><rect x="40" y="483" width="20" height="20" rx="4" fill="#2f7fe0"/><text x="72" y="500" font-size="20">accepted as documented: 27</text></g><g class="bph-p" style="animation-delay:2.1s"><text x="40" y="558" font-size="44" class="b" style="fill:#0969da">179</text></g><g class="bph-f" style="animation-delay:2.3s"><text x="144" y="532" font-size="20">byte-level mutants of the 3</text><text x="144" y="558" font-size="20">public formats, each read with</text><text x="144" y="584" font-size="20">the original pin and with a</text><text x="144" y="610" font-size="20">recomputed one</text></g><g class="bph-f" style="animation-delay:2.6s"><text x="40" y="652" font-size="20" class="mono">committed report; xtask verify</text><text x="40" y="678" font-size="20" class="mono">requires an identical rerun</text></g>
