.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.mut{fill:#9fb3c8}.b{font-weight:700}.sph-f{animation:sph-fade .7s ease-out both}.sph-g{animation:sph-grow 1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}.sph-p{animation:sph-pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}.sph-u{animation:sph-rise .8s cubic-bezier(.2,.8,.2,1) both}@keyframes sph-fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes sph-grow{from{transform:scaleX(0)}to{transform:none}}@keyframes sph-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}@keyframes sph-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.sph-f,.sph-g,.sph-p,.sph-u{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="926" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="926" rx="24" fill="url(#bg)" stroke="#30465f"/>
<text class="kick" x="30" y="44">SPEED AGAINST v0.6.1</text><g class="sph-f"><text x="30" y="96" font-size="44" class="b">133 timed cases</text><text x="30" y="130" font-size="24">in 23 of 24 timing programs</text><text class="mono" x="30" y="160" font-size="20">B: main at 876247f</text><text class="mono" x="30" y="186" font-size="20">set 2026-10-20-against-v0.6.1</text></g><g class="sph-g" style="animation-delay:.3s"><rect x="30.0" y="202" width="418.2" height="36" fill="#388bfd"/><rect x="448.2" y="202" width="48.7" height="36" fill="#8b949e"/><rect x="496.9" y="202" width="73.1" height="36" fill="#f85149"/><rect x="30" y="202" width="540" height="36" rx="3" fill="none" stroke="#30465f"/></g><g class="sph-p" style="animation-delay:1.0s"><text x="30" y="280" font-size="40" class="b" style="fill:#388bfd">103</text><text x="30" y="308" font-size="22">faster</text></g><g class="sph-p" style="animation-delay:1.1s"><text x="210" y="280" font-size="40" class="b" style="fill:#8b949e">12</text><text x="210" y="308" font-size="22">inside</text></g><g class="sph-p" style="animation-delay:1.3s"><text x="390" y="280" font-size="40" class="b" style="fill:#f85149">18</text><text x="390" y="308" font-size="22">slower</text></g><g class="sph-f" style="animation-delay:1.3s"><text x="30" y="338" font-size="20" class="mut">A case counts as faster or slower only</text><text x="30" y="364" font-size="20" class="mut">beyond its own A/A band.</text></g><g class="sph-p" style="animation-delay:1.5s"><path d="M32 398l9 9 17-20" fill="none" stroke="#56d364" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="412" font-size="34" class="b" style="fill:#56d364">22 of 23</text></g><text class="sph-f" style="animation-delay:1.6s" x="30" y="442" font-size="20">same output digest in A, A2 and B</text><g class="sph-f" style="animation-delay:1.7s"><text x="30" y="468" font-size="20" class="mut">1 differs: it counts the files of the</text><text x="30" y="494" font-size="20" class="mut">tree it runs in, and the two trees</text><text x="30" y="520" font-size="20" class="mut">differ.</text></g><g class="sph-f" style="animation-delay:1.9s"><text x="30" y="556" font-size="20">1 not built in v0.6.1: no timing.</text><text x="30" y="582" font-size="20">SHA-256 alone at 0.28 and 0.39: v0.6.1</text><text x="30" y="608" font-size="20">time divided by the new time. Ratios of</text><text x="30" y="634" font-size="20">different programs are not comparable</text><text x="30" y="660" font-size="20">with each other. The output digests, not</text><text x="30" y="686" font-size="20">the timings, are the claim.</text></g><g class="sph-f" style="animation-delay:2.2s"><text x="30" y="722" font-size="20" class="mut">Machine: AMD Ryzen AI 9 HX 370, 24</text><text x="30" y="748" font-size="20" class="mut">hardware threads, 94 GiB RAM, Linux</text><text x="30" y="774" font-size="20" class="mut">6.17. Load: load average 2.7 at the</text><text x="30" y="800" font-size="20" class="mut">start, 12.6 to 19.4 at the end, from</text><text x="30" y="826" font-size="20" class="mut">other work on the machine. Not pinned to</text><text x="30" y="852" font-size="20" class="mut">cores.</text><text x="30" y="878" font-size="20" class="mono">Cases are grouped by timing program.</text><text x="30" y="904" font-size="20" class="mono">Per-case results: docs/speed-results</text></g>
</svg>
