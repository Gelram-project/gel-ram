<svg xmlns="http://www.w3.org/2000/svg" width="600" height="928" viewBox="0 0 600 928" role="img" aria-labelledby="t d">
<title id="t">Speed against v0.6.1</title>
<desc id="d">Speed against v0.6.1, timing set 2026-10-20-against-v0.6.1: main at 876247f. 133 timed cases in 23 of 24 timing programs: 103 faster beyond their own A/A band, 18 slower beyond it and 12 inside it. SHA-256 alone at 0.28 and 0.39: v0.6.1 time divided by the new time. Cases are grouped by timing program; per-case results are in docs/speed-results/2026-10-20-against-v0.6.1. 22 of 23 timed programs printed the same output digest in all three trees. speed_top1_many has only a manifest: its API does not exist in v0.6.1, so the example does not build there. speed_tree_gates prints DIFFERENT_OUTPUT because it counts the files of the tree it runs in, and the two trees differ. Machine: AMD Ryzen AI 9 HX 370, 24 hardware threads, 94 GiB RAM, Linux 6.17; load average 2.7 at the start, 12.6 to 19.4 at the end, from other work on the machine; not pinned to cores. Ratios of different programs are not comparable with each other; the output digests, not the timings, are the claim.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
