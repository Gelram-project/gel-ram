<title id="t">GEL RAM — Knowledge printed, not trained</title>
<desc id="d">The logo: a translucent cube of source cells with one exact cell lit and a pin seal. GEL RAM. Knowledge printed, not trained. One stored record, four exact views, 1,152 bytes. Read back exactly; a process kill, not a power cut, loses nothing it confirmed.</desc>
