<svg xmlns="http://www.w3.org/2000/svg" width="600" height="884" viewBox="0 0 600 884" role="img" aria-labelledby="t d">
<title id="t">Published commitments</title>
<desc id="d">9 commitments, 2026-10-20 to 2026-11-05: each the SHA-256 of a manifest of a private directory, shown by its first 8 hex characters with its directory and file counts. Checkable with xtask commitment-check once the files are handed over; a hash shows they did not change, not that they are correct.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#0969da}
.pp-hx{fill:#0969da;font-weight:700}.pp-big{transform-box:fill-box;transform-origin:0 100%;animation:pp-pop .6s cubic-bezier(.2,.8,.2,1) .1s both}.pp-cd{animation:pp-in .55s cubic-bezier(.2,.8,.2,1) both}.pp-ft{animation:pp-fade .8s ease-out both}@keyframes pp-fade{from{opacity:0}to{opacity:1}}@keyframes pp-pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}@keyframes pp-in{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.pp-big,.pp-cd,.pp-ft{animation:none}}.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="882" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="882" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="30" y="44">PUBLISHED COMMITMENTS</text><g class="pp-big"><text x="30" y="106" font-size="56" class="b" style="fill:#0969da">9</text><text x="81.7" y="84" font-size="26" class="b">commitments</text></g><text x="81.7" y="110" font-size="20" class="mut">2026-10-20 → 2026-11-05</text><g class="pp-cd" style="animation-delay:0.30s"><rect x="30.0" y="124.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="148.0" font-size="20" class="b">Private source tree 1</text><text x="556.0" y="148.0" font-size="20" text-anchor="end" class="mono pp-hx">69c10bd5</text><text x="44.0" y="172.0" font-size="20" class="b" style="fill:#0969da">10-20</text><text x="123.4" y="172.0" font-size="20">1,436 directories · 4,054 files</text></g><g class="pp-cd" style="animation-delay:0.45s"><rect x="30.0" y="188.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="212.0" font-size="20" class="b">Private data set 1</text><text x="556.0" y="212.0" font-size="20" text-anchor="end" class="mono pp-hx">ab5e8b71</text><text x="44.0" y="236.0" font-size="20" class="b" style="fill:#0969da">10-21</text><text x="123.4" y="236.0" font-size="20">6 directories · 44 files</text></g><g class="pp-cd" style="animation-delay:0.60s"><rect x="30.0" y="252.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="276.0" font-size="20" class="b">Private data set 2</text><text x="556.0" y="276.0" font-size="20" text-anchor="end" class="mono pp-hx">3bf2af2f</text><text x="44.0" y="300.0" font-size="20" class="b" style="fill:#0969da">10-24</text><text x="123.4" y="300.0" font-size="20">6 directories · 47 files</text></g><g class="pp-cd" style="animation-delay:0.75s"><rect x="30.0" y="316.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="340.0" font-size="20" class="b">Private data set 3</text><text x="556.0" y="340.0" font-size="20" text-anchor="end" class="mono pp-hx">cdba706f</text><text x="44.0" y="364.0" font-size="20" class="b" style="fill:#0969da">10-24</text><text x="123.4" y="364.0" font-size="20">2 directories · 15 files</text></g><g class="pp-cd" style="animation-delay:0.90s"><rect x="30.0" y="380.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="404.0" font-size="20" class="b">Private data set 4</text><text x="556.0" y="404.0" font-size="20" text-anchor="end" class="mono pp-hx">1188571b</text><text x="44.0" y="428.0" font-size="20" class="b" style="fill:#0969da">10-24</text><text x="123.4" y="428.0" font-size="20">0 directories · 8 files</text></g><g class="pp-cd" style="animation-delay:1.05s"><rect x="30.0" y="444.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="468.0" font-size="20" class="b">Private data set 5</text><text x="556.0" y="468.0" font-size="20" text-anchor="end" class="mono pp-hx">9c0ed62b</text><text x="44.0" y="492.0" font-size="20" class="b" style="fill:#0969da">10-24</text><text x="123.4" y="492.0" font-size="20">70 directories · 519 files</text></g><g class="pp-cd" style="animation-delay:1.20s"><rect x="30.0" y="508.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="532.0" font-size="20" class="b">Sealed sample 1</text><text x="556.0" y="532.0" font-size="20" text-anchor="end" class="mono pp-hx">8260b56c</text><text x="44.0" y="556.0" font-size="20" class="b" style="fill:#0969da">10-24</text><text x="123.4" y="556.0" font-size="20">4 directories · 129 files</text></g><g class="pp-cd" style="animation-delay:1.35s"><rect x="30.0" y="572.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="596.0" font-size="20" class="b">Private source tree 2</text><text x="556.0" y="596.0" font-size="20" text-anchor="end" class="mono pp-hx">59a95b6f</text><text x="44.0" y="620.0" font-size="20" class="b" style="fill:#0969da">11-01</text><text x="123.4" y="620.0" font-size="20">18 directories · 82 files</text></g><g class="pp-cd" style="animation-delay:1.50s"><rect x="30.0" y="636.0" width="540.0" height="60.0" rx="10" fill="#0969da" fill-opacity=".08" stroke="#cbdcf0"/><text x="44.0" y="660.0" font-size="20" class="b">Target Q8 Quad quantizer</text><text x="556.0" y="660.0" font-size="20" text-anchor="end" class="mono pp-hx">0034f6ee</text><text x="44.0" y="684.0" font-size="20" class="b" style="fill:#0969da">11-05</text><text x="123.4" y="684.0" font-size="20">3 directories · 10 files</text></g><g class="pp-ft" style="animation-delay:1.85s"><text x="30.0" y="720.0" font-size="20" class="b">Hashed now</text><text x="30.0" y="748.0" font-size="20" class="b">checkable with xtask commitment-check</text><text x="30.0" y="774.0" font-size="20" class="b">once the files are handed over</text><text x="30.0" y="802.0" font-size="20" class="mut">A hash shows they did not change, not</text><text x="30.0" y="828.0" font-size="20" class="mut">that they are correct</text><text x="30.0" y="856.0" font-size="20" class="mut">each code: first 8 hex of its SHA-256</text></g>
</svg>
