<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d">
<title id="t">What happens to a citation</title>
<desc id="d">Animated illustration: a document with a highlighted exact quote becomes a snapshot pinned by SHA-256; a new process reopens it with the same pin and passes; a copy with one changed byte is refused. Drawn, not recorded; not a timing measurement.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.mut{fill:#9fb3c8}.b{font-weight:700}.fq-c{transform-box:fill-box;transform-origin:center}.fq0{animation:fq-hot 1s ease-in-out 4.6s 6 alternate both}.fq1{animation:fq-flow 1s linear infinite}.fq2{animation:fq-in .5s ease-out .9s both}.fq3{animation:fq-in .5s ease-out 2s both}.fq4{animation:fq-in .5s ease-out 3s both}.fq5{animation:fq-drop .6s cubic-bezier(.2,.8,.2,1) .2s both}.fq6{animation:fq-pop .6s cubic-bezier(.2,.8,.2,1) 1.3s both}.fq7{animation:fq-drop .6s cubic-bezier(.2,.8,.2,1) 2.4s both}.fq8{animation:fq-drop .6s cubic-bezier(.2,.8,.2,1) 3.4s both,fq-shake .5s ease-in-out 4.1s both}@media (prefers-reduced-motion:reduce){.fq0,.fq1,.fq2,.fq3,.fq4,.fq5,.fq6,.fq7,.fq8{animation:none}}@keyframes fq-in{from{opacity:0}to{opacity:1}}@keyframes fq-drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}@keyframes fq-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}@keyframes fq-shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}@keyframes fq-hot{from{opacity:1}to{opacity:.35}}@keyframes fq-flow{to{stroke-dashoffset:-36}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="898" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="898" rx="24" fill="url(#bg)" stroke="#30465f"/>
<text class="kick" x="40" y="56">WHAT HAPPENS TO A CITATION</text><g class="fq2"><path class="fq1" d="M100 216V264" stroke="#58a6ff" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/><path d="M100 274l-8 -13h16z" fill="#58a6ff"/></g><g class="fq3"><path class="fq1" d="M100 392V440" stroke="#58a6ff" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/><path d="M100 450l-8 -13h16z" fill="#58a6ff"/></g><g class="fq4"><path class="fq1" d="M48 332C14 332 14 688 40 688" stroke="#58a6ff" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/><path d="M54 688l-13 -8v16z" fill="#58a6ff"/></g><g class="fq-c fq5"><g><polygon points="70.0,130.0 148.0,130.0 148.0,216.0 70.0,216.0" fill="#9fb3c8" stroke="#00000022" stroke-width=".6"/><polygon points="148.0,130.0 154.0,124.0 154.0,210.0 148.0,216.0" fill="#6e859e" stroke="#00000022" stroke-width=".6"/><polygon points="70.0,130.0 76.0,124.0 154.0,124.0 148.0,130.0" fill="#e6edf3" stroke="#00000022" stroke-width=".6"/><polygon points="62.0,122.0 140.0,122.0 140.0,208.0 62.0,208.0" fill="#9fb3c8" stroke="#00000022" stroke-width=".6"/><polygon points="140.0,122.0 146.0,116.0 146.0,202.0 140.0,208.0" fill="#6e859e" stroke="#00000022" stroke-width=".6"/><polygon points="62.0,122.0 68.0,116.0 146.0,116.0 140.0,122.0" fill="#e6edf3" stroke="#00000022" stroke-width=".6"/><polygon points="54.0,114.0 132.0,114.0 132.0,200.0 54.0,200.0" fill="#9fb3c8" stroke="#00000022" stroke-width=".6"/><polygon points="132.0,114.0 138.0,108.0 138.0,194.0 132.0,200.0" fill="#6e859e" stroke="#00000022" stroke-width=".6"/><polygon points="54.0,114.0 60.0,108.0 138.0,108.0 132.0,114.0" fill="#e6edf3" stroke="#00000022" stroke-width=".6"/><rect x="62" y="128" width="52" height="4" rx="2" fill="#26405f"/><rect x="62" y="142" width="48" height="4" rx="2" fill="#26405f"/><rect x="62" y="154" width="62" height="8" rx="2" fill="#58a6ff"/><rect x="62" y="170" width="40" height="4" rx="2" fill="#26405f"/><rect x="62" y="184" width="36" height="4" rx="2" fill="#26405f"/></g><text x="180" y="136" font-size="24" class="b">Your document</text><text x="180" y="166" font-size="20" class="mono">exact quote, bytes 67..105</text></g><g class="fq-c fq6"><g><polygon points="52.0,286.0 136.0,286.0 136.0,370.0 52.0,370.0" fill="#388bfd" stroke="#00000022" stroke-width=".6"/><polygon points="136.0,286.0 150.0,272.0 150.0,356.0 136.0,370.0" fill="#1f6feb" stroke="#00000022" stroke-width=".6"/><polygon points="52.0,286.0 66.0,272.0 150.0,272.0 136.0,286.0" fill="#79c0ff" stroke="#00000022" stroke-width=".6"/><rect x="77" y="322" width="34" height="28" rx="5" fill="#ffffff" opacity=".92"/><path d="M85 322v-8a9 9 0 0 1 18 0v8" fill="none" stroke="#ffffff" stroke-width="5" opacity=".92"/><circle cx="94" cy="336" r="4.5" fill="#1f6feb"/></g><text x="180" y="312" font-size="24" class="b">Pinned snapshot</text><text x="180" y="342" font-size="20" class="mono">SHA-256 you keep</text></g><g class="fq-c fq7"><g><polygon points="58.0,466.0 134.0,466.0 134.0,542.0 58.0,542.0" fill="#2ea043" stroke="#00000022" stroke-width=".6"/><polygon points="134.0,466.0 146.0,454.0 146.0,530.0 134.0,542.0" fill="#196c2e" stroke="#00000022" stroke-width=".6"/><polygon points="58.0,466.0 70.0,454.0 146.0,454.0 134.0,466.0" fill="#56d364" stroke="#00000022" stroke-width=".6"/><path d="M74 504l13 13 24-28" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="180" y="488" font-size="24" class="b">Reopened</text><text x="180" y="518" font-size="24" class="b" style="fill:#56d364">PASS</text><text x="180" y="548" font-size="20" class="mono">new process, same pin</text></g><g class="fq-c fq8"><g><polygon points="58.0,642.0 134.0,642.0 134.0,718.0 58.0,718.0" fill="#f85149" stroke="#00000022" stroke-width=".6"/><polygon points="134.0,642.0 146.0,630.0 146.0,706.0 134.0,718.0" fill="#b62324" stroke="#00000022" stroke-width=".6"/><polygon points="58.0,642.0 70.0,630.0 146.0,630.0 134.0,642.0" fill="#ff9492" stroke="#00000022" stroke-width=".6"/><rect x="63" y="647" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="63" y="664" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="63" y="681" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="63" y="698" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="80" y="647" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="80" y="664" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="80" y="681" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="80" y="698" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="97" y="647" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect class="fq0" x="97" y="664" width="15" height="15" rx="2" fill="#ffffff" opacity="1"/><rect x="97" y="681" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="97" y="698" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="114" y="647" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="114" y="664" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="114" y="681" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/><rect x="114" y="698" width="15" height="15" rx="2" fill="#ffffff" opacity=".22"/></g><text x="180" y="664" font-size="24" class="b">1 byte changed</text><text x="180" y="694" font-size="24" class="b" style="fill:#ff9492">REFUSED</text><text x="180" y="724" font-size="20" class="mono">copy with the old pin</text></g><text x="40" y="810" font-size="20" class="mut">Drawn, not recorded: the flow the six</text><text x="40" y="838" font-size="20" class="mut">recorded runs below show</text><text x="40" y="866" font-size="20" class="mut">not a timing measurement</text>
</svg>
