.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.mut{fill:#9fb3c8}.b{font-weight:700}.tq-c{transform-box:fill-box;transform-origin:right;transform:scaleX(0)}.tq0{animation:tq-in .4s ease-out 0.30s both}.tq1{animation:tq-type 0.45s steps(9) 0.45s both}.tq2{animation:tq-in .4s ease-out 0.95s both}.tq3{animation:tq-in .4s ease-out 1.00s both}.tq4{animation:tq-type 0.60s steps(12) 1.15s both}.tq5{animation:tq-in .4s ease-out 1.80s both}.tq6{animation:tq-in .4s ease-out 1.70s both}.tq7{animation:tq-type 0.75s steps(15) 1.85s both}.tq8{animation:tq-in .4s ease-out 2.65s both}.tq9{animation:tq-in .4s ease-out 2.40s both}.tq10{animation:tq-type 0.75s steps(15) 2.55s both}.tq11{animation:tq-in .4s ease-out 3.35s both}.tq12{animation:tq-in .4s ease-out 3.10s both}.tq13{animation:tq-type 0.30s steps(6) 3.25s both}.tq14{animation:tq-in .4s ease-out 3.60s both}@media (prefers-reduced-motion:reduce){.tq0,.tq1,.tq2,.tq3,.tq4,.tq5,.tq6,.tq7,.tq8,.tq9,.tq10,.tq11,.tq12,.tq13,.tq14{animation:none}}@keyframes tq-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}@keyframes tq-type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
</style>
