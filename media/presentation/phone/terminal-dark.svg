<svg xmlns="http://www.w3.org/2000/svg" width="600" height="788" viewBox="0 0 600 788" role="img" aria-labelledby="t d">
<title id="t">Run it yourself — drawn, not a recording</title>
<desc id="d">Drawn, what to look for: --literal: ROUNDTRIP=4/4 DIFFERENT_BITS=0, TAMPER=REJECTED; quad_compare: Q8_QUAD_EXACT=PASS SEMANTIC_ACCURACY=NOT_MEASURED; mutation-matrix: MUTATION_MATRIX=PASS mutants=179; crash-series 20: CRASH_SERIES=PASS with acknowledged_lost=0; verify: GEL_VERIFY_ALL=PASS.</desc>
<style>
