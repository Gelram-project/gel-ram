<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="t d">
<title id="t">Where GEL RAM stands</title>
<desc id="d">Checkable here: exact read-back through four views, a changed byte refused, nothing confirmed lost to a kill. Private: printing and answering; 9 published commitments fix the contents of private directories as of their dates; only their labels say what each holds. The text AI is a goal.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.sc{animation:sprise .75s cubic-bezier(.2,.8,.2,1) both}.si{animation:spfade .6s ease-out both}.sd{animation:spdraw .9s ease-out both}.sq{animation:sppulse .7s ease-in-out both;transform-box:fill-box;transform-origin:center}.rl{animation-duration:1.4s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}.ro52s9{animation-name:ro52s9}@keyframes ro52s9{from{transform:translateY(514.8px)}}@keyframes sprise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}@keyframes spfade{from{opacity:0}to{opacity:1}}@keyframes spdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes sppulse{0%,100%{transform:none}50%{transform:scale(1.16)}}.mut{fill:#9fb3c8}.b{font-weight:700}@media (prefers-reduced-motion:reduce){.sc,.si,.sd,.sq,.rl,.ro52s9{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="838" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="838" rx="24" fill="url(#bg)" stroke="#30465f"/>
<text class="kick" x="32" y="44">WHERE GEL RAM STANDS</text><g class="sc" style="animation-delay:0.10s"><clipPath id="spcol0"><rect x="24" y="58" width="552" height="214.0" rx="20"/></clipPath><rect x="24" y="58" width="552" height="214.0" rx="20" fill="#56d364" fill-opacity=".07" stroke="#56d364" stroke-opacity=".45"/><rect x="24" y="58" width="552" height="6" fill="#56d364" clip-path="url(#spcol0)"/><g transform="translate(64 92)"><g class="sq" style="animation-delay:0.70s"><circle r="22" fill="#56d364" fill-opacity=".14" stroke="#56d364" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-13 1L-4 10L14 -10" stroke="#56d364" stroke-width="6"/></g></g><text x="96" y="101" font-size="24" class="b" style="fill:#56d364">Check it here</text><path d="M40 120H560" stroke="#56d364" stroke-opacity=".35" stroke-width="1.5"/><text class="b" x="560" y="101.0" font-size="20" text-anchor="end" style="fill:#56d364">One command each</text><g class="si" style="animation-delay:0.40s"><circle cx="50" cy="137.0" r="5" fill="#56d364"/><text x="66" y="144.0" font-size="20">One record read back exactly through</text><text x="66" y="170.0" font-size="20">four views</text></g><g class="si" style="animation-delay:0.55s"><circle cx="50" cy="193.0" r="5" fill="#56d364"/><text x="66" y="200.0" font-size="20">A changed byte refused</text></g><g class="si" style="animation-delay:0.70s"><circle cx="50" cy="223.0" r="5" fill="#56d364"/><text x="66" y="230.0" font-size="20">A killed process losing nothing it</text><text x="66" y="256.0" font-size="20">confirmed</text></g></g><g class="sc" style="animation-delay:0.60s"><clipPath id="spcol1"><rect x="24" y="282" width="552" height="342.0" rx="20"/></clipPath><rect x="24" y="282" width="552" height="342.0" rx="20" fill="#58a6ff" fill-opacity=".07" stroke="#58a6ff" stroke-opacity=".45"/><rect x="24" y="282" width="552" height="6" fill="#58a6ff" clip-path="url(#spcol1)"/><g transform="translate(64 316)"><g class="sq" style="animation-delay:1.20s"><circle r="22" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-8.5 -3V-9A8.5 8.5 0 0 1 8.5 -9V-3" stroke="#58a6ff" stroke-width="4.5"/><rect x="-14" y="-3" width="28" height="21" rx="4" fill="#58a6ff"/><circle cx="0" cy="5.5" r="3" fill="#101d31"/><rect x="-1.4" y="6" width="2.8" height="6" fill="#101d31"/></g></g><text x="96" y="325" font-size="24" class="b" style="fill:#58a6ff">Private</text><path d="M40 344H560" stroke="#58a6ff" stroke-opacity=".35" stroke-width="1.5"/><g class="si" style="animation-delay:0.90s"><circle cx="50" cy="361.0" r="5" fill="#58a6ff"/><text x="66" y="368.0" font-size="20">The step that prints text into</text><text x="66" y="394.0" font-size="20">records</text></g><g class="si" style="animation-delay:1.05s"><circle cx="50" cy="417.0" r="5" fill="#58a6ff"/><text x="66" y="424.0" font-size="20">The private build that answers from</text><text x="66" y="450.0" font-size="20">them</text></g><g class="si" style="animation-delay:1.20s"><circle cx="50" cy="473.0" r="5" fill="#58a6ff"/><text x="66" y="480.0" font-size="20">Both exist only on the author's</text><text x="66" y="506.0" font-size="20">machine</text></g><rect x="40" y="526.0" width="520" height="84" rx="12" fill="#58a6ff" fill-opacity=".13"/><text class="b" x="111.3" y="548.0" font-size="20">published commitments</text><text x="111.3" y="572.0" font-size="20">fix private files</text><text x="111.3" y="596.0" font-size="20">as of their dates</text><g class="roll" aria-label="9" font-size="52" font-weight="700" style="fill:#58a6ff"><clipPath id="glroll0"><rect x="57.9" y="538.2" width="37.4" height="60.3"/></clipPath><g clip-path="url(#glroll0)"><g class="rl ro52s9" style="animation-delay:1.20s"><text x="60.0" y="71.2" style="fill:#58a6ff">0</text><text x="60.0" y="128.4" style="fill:#58a6ff">1</text><text x="60.0" y="185.6" style="fill:#58a6ff">2</text><text x="60.0" y="242.8" style="fill:#58a6ff">3</text><text x="60.0" y="300.0" style="fill:#58a6ff">4</text><text x="60.0" y="357.2" style="fill:#58a6ff">5</text><text x="60.0" y="414.4" style="fill:#58a6ff">6</text><text x="60.0" y="471.6" style="fill:#58a6ff">7</text><text x="60.0" y="528.8" style="fill:#58a6ff">8</text><text class="rf" x="60.0" y="586.0" style="fill:#58a6ff">9</text></g></g></g></g><g class="sc" style="animation-delay:1.10s"><clipPath id="spcol2"><rect x="24" y="634" width="552" height="188.0" rx="20"/></clipPath><rect x="24" y="634" width="552" height="188.0" rx="20" fill="#e3b341" fill-opacity=".07" stroke="#e3b341" stroke-opacity=".45"/><rect x="24" y="634" width="552" height="6" fill="#e3b341" clip-path="url(#spcol2)"/><g transform="translate(64 668)"><g class="sq" style="animation-delay:1.70s"><circle r="22" fill="#e3b341" fill-opacity=".14" stroke="#e3b341" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-11 -15H11M-11 15H11M-8.5 -15C-8.5 -3 8.5 3 8.5 15M8.5 -15C8.5 -3 -8.5 3 -8.5 15" stroke="#e3b341" stroke-width="3.5"/><path d="M-5.5 12H5.5L0 5Z" fill="#e3b341"/></g></g><text x="96" y="677" font-size="24" class="b" style="fill:#e3b341">Not established</text><path d="M40 696H560" stroke="#e3b341" stroke-opacity=".35" stroke-width="1.5"/><text class="mono b" x="560" y="677.0" font-size="20" text-anchor="end" style="fill:#e3b341">NOT_ESTABLISHED</text><g class="si" style="animation-delay:1.40s"><circle cx="50" cy="713.0" r="5" fill="#e3b341"/><text x="66" y="720.0" font-size="20">The text AI is a goal, not a result</text></g><g class="si" style="animation-delay:1.55s"><circle cx="50" cy="743.0" r="5" fill="#e3b341"/><text x="66" y="750.0" font-size="20">Hardware-level memory computation</text></g><g class="si" style="animation-delay:1.70s"><circle cx="50" cy="773.0" r="5" fill="#e3b341"/><text x="66" y="780.0" font-size="20">Power-cut durability of snapshots</text><text x="66" y="806.0" font-size="20">and of the record history</text></g></g>
</svg>
