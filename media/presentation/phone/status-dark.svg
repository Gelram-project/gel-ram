<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1344" viewBox="0 0 600 1344" role="img" aria-labelledby="t d">
<title id="t">Where GEL RAM stands</title>
<desc id="d">Checkable here: exact read-back through four views, a changed byte refused, nothing confirmed lost to a kill. Private: printing and answering; 9 published commitments fix the contents of private directories as of their dates; only their labels say what each holds. The text AI is a goal.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.sc{animation:sprise .75s cubic-bezier(.2,.8,.2,1) both}.si{animation:spfade .6s ease-out both}.sd{animation:spdraw .9s ease-out both}.sq{animation:sppulse .7s ease-in-out both;transform-box:fill-box;transform-origin:center}.rl{animation-duration:1.4s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}.ro56s9{animation-name:ro56s9}@keyframes ro56s9{from{transform:translateY(554.4px)}}@keyframes sprise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}@keyframes spfade{from{opacity:0}to{opacity:1}}@keyframes spdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes sppulse{0%,100%{transform:none}50%{transform:scale(1.16)}}.mut{fill:#9fb3c8}.b{font-weight:700}@media (prefers-reduced-motion:reduce){.sc,.si,.sd,.sq,.rl,.ro56s9{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="1342" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="1342" rx="24" fill="url(#bg)" stroke="#30465f"/>
<text class="kick" x="32" y="50">WHERE GEL RAM STANDS</text><g class="sc" style="animation-delay:0.10s"><clipPath id="spcol0"><rect x="24" y="72" width="552" height="365.0" rx="20"/></clipPath><rect x="24" y="72" width="552" height="365.0" rx="20" fill="#56d364" fill-opacity=".07" stroke="#56d364" stroke-opacity=".45"/><rect x="24" y="72" width="552" height="8" fill="#56d364" clip-path="url(#spcol0)"/><g transform="translate(72 122)"><g class="sq" style="animation-delay:0.70s"><circle r="26" fill="#56d364" fill-opacity=".14" stroke="#56d364" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-13 1L-4 10L14 -10" stroke="#56d364" stroke-width="6"/></g></g><text x="116" y="133" font-size="30" class="b" style="fill:#56d364">Check it here</text><path d="M48 154H552" stroke="#56d364" stroke-opacity=".35" stroke-width="1.5"/><g class="si" style="animation-delay:0.40s"><circle cx="58" cy="180.0" r="5" fill="#56d364"/><text x="80" y="188.0" font-size="24">One record read back exactly</text><text x="80" y="219.0" font-size="24">through four views</text></g><g class="si" style="animation-delay:0.55s"><circle cx="58" cy="250.0" r="5" fill="#56d364"/><text x="80" y="258.0" font-size="24">A changed byte refused</text></g><g class="si" style="animation-delay:0.70s"><circle cx="58" cy="289.0" r="5" fill="#56d364"/><text x="80" y="297.0" font-size="24">A killed process losing</text><text x="80" y="328.0" font-size="24">nothing it confirmed</text></g><rect x="40" y="361.0" width="520" height="60" rx="12" fill="#56d364" fill-opacity=".13"/><text class="b" x="300" y="400.0" font-size="24" text-anchor="middle" style="fill:#56d364">One command each</text></g><g class="sc" style="animation-delay:0.60s"><clipPath id="spcol1"><rect x="24" y="453" width="552" height="436.0" rx="20"/></clipPath><rect x="24" y="453" width="552" height="436.0" rx="20" fill="#58a6ff" fill-opacity=".07" stroke="#58a6ff" stroke-opacity=".45"/><rect x="24" y="453" width="552" height="8" fill="#58a6ff" clip-path="url(#spcol1)"/><g transform="translate(72 503)"><g class="sq" style="animation-delay:1.20s"><circle r="26" fill="#58a6ff" fill-opacity=".14" stroke="#58a6ff" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-8.5 -3V-9A8.5 8.5 0 0 1 8.5 -9V-3" stroke="#58a6ff" stroke-width="4.5"/><rect x="-14" y="-3" width="28" height="21" rx="4" fill="#58a6ff"/><circle cx="0" cy="5.5" r="3" fill="#101d31"/><rect x="-1.4" y="6" width="2.8" height="6" fill="#101d31"/></g></g><text x="116" y="514" font-size="30" class="b" style="fill:#58a6ff">Private</text><path d="M48 535H552" stroke="#58a6ff" stroke-opacity=".35" stroke-width="1.5"/><g class="si" style="animation-delay:0.90s"><circle cx="58" cy="561.0" r="5" fill="#58a6ff"/><text x="80" y="569.0" font-size="24">The step that prints text</text><text x="80" y="600.0" font-size="24">into records</text></g><g class="si" style="animation-delay:1.05s"><circle cx="58" cy="631.0" r="5" fill="#58a6ff"/><text x="80" y="639.0" font-size="24">The private build that</text><text x="80" y="670.0" font-size="24">answers from them</text></g><g class="si" style="animation-delay:1.20s"><circle cx="58" cy="701.0" r="5" fill="#58a6ff"/><text x="80" y="709.0" font-size="24">Both exist only on the</text><text x="80" y="740.0" font-size="24">author's machine</text></g><rect x="40" y="773.0" width="520" height="100" rx="12" fill="#58a6ff" fill-opacity=".13"/><text class="b" x="113.8" y="804.0" font-size="22">published commitments</text><text x="113.8" y="832.0" font-size="22">fix private files</text><text x="113.8" y="860.0" font-size="22">as of their dates</text><g class="roll" aria-label="9" font-size="56" font-weight="700" style="fill:#58a6ff"><clipPath id="glroll0"><rect x="57.8" y="791.5" width="40.3" height="65.0"/></clipPath><g clip-path="url(#glroll0)"><g class="rl ro56s9" style="animation-delay:1.20s"><text x="60.0" y="288.6" style="fill:#58a6ff">0</text><text x="60.0" y="350.2" style="fill:#58a6ff">1</text><text x="60.0" y="411.8" style="fill:#58a6ff">2</text><text x="60.0" y="473.4" style="fill:#58a6ff">3</text><text x="60.0" y="535.0" style="fill:#58a6ff">4</text><text x="60.0" y="596.6" style="fill:#58a6ff">5</text><text x="60.0" y="658.2" style="fill:#58a6ff">6</text><text x="60.0" y="719.8" style="fill:#58a6ff">7</text><text x="60.0" y="781.4" style="fill:#58a6ff">8</text><text class="rf" x="60.0" y="843.0" style="fill:#58a6ff">9</text></g></g></g></g><g class="sc" style="animation-delay:1.10s"><clipPath id="spcol2"><rect x="24" y="905" width="552" height="427.0" rx="20"/></clipPath><rect x="24" y="905" width="552" height="427.0" rx="20" fill="#e3b341" fill-opacity=".07" stroke="#e3b341" stroke-opacity=".45"/><rect x="24" y="905" width="552" height="8" fill="#e3b341" clip-path="url(#spcol2)"/><g transform="translate(72 955)"><g class="sq" style="animation-delay:1.70s"><circle r="26" fill="#e3b341" fill-opacity=".14" stroke="#e3b341" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-11 -15H11M-11 15H11M-8.5 -15C-8.5 -3 8.5 3 8.5 15M8.5 -15C8.5 -3 -8.5 3 -8.5 15" stroke="#e3b341" stroke-width="3.5"/><path d="M-5.5 12H5.5L0 5Z" fill="#e3b341"/></g></g><text x="116" y="966" font-size="30" class="b" style="fill:#e3b341">Not established</text><path d="M48 987H552" stroke="#e3b341" stroke-opacity=".35" stroke-width="1.5"/><g class="si" style="animation-delay:1.40s"><circle cx="58" cy="1013.0" r="5" fill="#e3b341"/><text x="80" y="1021.0" font-size="24">The text AI is a goal, not a</text><text x="80" y="1052.0" font-size="24">result</text></g><g class="si" style="animation-delay:1.55s"><circle cx="58" cy="1083.0" r="5" fill="#e3b341"/><text x="80" y="1091.0" font-size="24">Hardware-level memory</text><text x="80" y="1122.0" font-size="24">computation</text></g><g class="si" style="animation-delay:1.70s"><circle cx="58" cy="1153.0" r="5" fill="#e3b341"/><text x="80" y="1161.0" font-size="24">Power-cut durability of</text><text x="80" y="1192.0" font-size="24">snapshots and of the record</text><text x="80" y="1223.0" font-size="24">history</text></g><rect x="40" y="1256.0" width="520" height="60" rx="12" fill="#e3b341" fill-opacity=".13"/><text class="mono b" x="300" y="1295.0" font-size="24" text-anchor="middle" style="fill:#e3b341">NOT_ESTABLISHED</text></g>
</svg>
