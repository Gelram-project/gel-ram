<svg xmlns="http://www.w3.org/2000/svg" width="600" height="860" viewBox="0 0 600 860" role="img" aria-labelledby="t d">
<title id="t">One stored Q8 record, four exact views</title>
<desc id="d">One stored Q8 record: 1,024 one-byte values and a 128-byte activity mask, 1,152 bytes, read through four equivalent views without four copies. Four packed copies would take 4,608 bytes; the reference layout used for checking takes 8,192 bytes. 48 of 48 recorded runs end with Q8_QUAD_EXACT=PASS; semantic accuracy is not measured. Record payload only, not process memory; not four independent memories.</desc>
<style>
svg{font-size:20px}
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:20px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}.rq-c{transform-box:fill-box;transform-origin:center}.rq0{animation:rq-pop .6s cubic-bezier(.2,.8,.2,1) .1s both}.rq1{animation:rq-in .5s ease-out .5s both}.rq2{animation:rq-in .4s ease-out 0.90s both}.rq3{animation:rq-pop .5s cubic-bezier(.2,.8,.2,1) 1.40s both}.rq4{animation:rq-in .4s ease-out 1.00s both}.rq5{animation:rq-pop .5s cubic-bezier(.2,.8,.2,1) 1.70s both}.rq6{animation:rq-in .4s ease-out 1.10s both}.rq7{animation:rq-pop .5s cubic-bezier(.2,.8,.2,1) 2.00s both}.rq8{animation:rq-in .4s ease-out 1.20s both}.rq9{animation:rq-pop .5s cubic-bezier(.2,.8,.2,1) 2.30s both}.rq10{animation:rq-in .5s ease-out 2.6s both}@media (prefers-reduced-motion:reduce){.rq0,.rq1,.rq2,.rq3,.rq4,.rq5,.rq6,.rq7,.rq8,.rq9,.rq10{animation:none}}@keyframes rq-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes rq-pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="598" height="858" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="598" height="858" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="56">THE RECORDED RUNS</text><g class="rq-c rq0"><text x="40" y="136" font-size="68" class="b" style="fill:#1a7f37">48 of 48</text></g><g class="rq1"><text x="40" y="176" font-size="24">recorded runs end with</text><rect x="40" y="196" width="520" height="104" rx="16" fill="#f7fbff" stroke="#cbdcf0"/><text x="60" y="238" font-size="20" class="mono b">Q8_QUAD_EXACT=PASS</text><text x="60" y="276" font-size="20" class="mono b">SEMANTIC_ACCURACY=NOT_MEASURED</text></g><text class="kick" x="40" y="360">EACH VIEW, BIT FOR BIT</text><text x="40" y="392" font-size="20" class="mono">score vs a separate written-out copy</text><g class="rq2"><rect x="40" y="414" width="520" height="54" rx="12" fill="#f7fbff" stroke="#0969da" stroke-width="2"/><text x="58" y="450" font-size="24" class="b">view 1</text></g><g class="rq-c rq3"><text x="174" y="448" font-size="20">score = copy's score</text><circle cx="530" cy="441" r="15" fill="#1a7f37"/><path d="M523 441l5 5 10-10" stroke="#f7fbff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="rq4"><rect x="40" y="478" width="520" height="54" rx="12" fill="#f7fbff" stroke="#0969da" stroke-width="2"/><text x="58" y="514" font-size="24" class="b">view 2</text></g><g class="rq-c rq5"><text x="174" y="512" font-size="20">score = copy's score</text><circle cx="530" cy="505" r="15" fill="#1a7f37"/><path d="M523 505l5 5 10-10" stroke="#f7fbff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="rq6"><rect x="40" y="542" width="520" height="54" rx="12" fill="#f7fbff" stroke="#0969da" stroke-width="2"/><text x="58" y="578" font-size="24" class="b">view 3</text></g><g class="rq-c rq7"><text x="174" y="576" font-size="20">score = copy's score</text><circle cx="530" cy="569" r="15" fill="#1a7f37"/><path d="M523 569l5 5 10-10" stroke="#f7fbff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="rq8"><rect x="40" y="606" width="520" height="54" rx="12" fill="#f7fbff" stroke="#0969da" stroke-width="2"/><text x="58" y="642" font-size="24" class="b">view 4</text></g><g class="rq-c rq9"><text x="174" y="640" font-size="20">score = copy's score</text><circle cx="530" cy="633" r="15" fill="#1a7f37"/><path d="M523 633l5 5 10-10" stroke="#f7fbff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g class="rq10"><text x="40" y="718" font-size="22" class="b">reference layout</text><text x="560" y="718" font-size="22" class="b" text-anchor="end">8,192 B</text><text x="40" y="746" font-size="20" class="mut">used for checking</text></g><text x="40" y="802" font-size="20" class="mut">Record payload only; process memory is</text><text x="40" y="830" font-size="20" class="mut">additional.</text>
</svg>
