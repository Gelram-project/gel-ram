<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1804" viewBox="0 0 600 1804" role="img" aria-labelledby="t d">
<title id="t">What one Q8 record holds</title>
<desc id="d">What a Q8 record holds: 1,024 values of one byte each plus a 128-byte mask, one bit per value, make 1,152 bytes in memory, held once. Four views read that same record, each exactly as its own full copy would; four copies would take 4,608 bytes. Not four memories, votes or a speedup.</desc>
