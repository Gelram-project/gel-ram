t-size="24" class="b">1,024 B</text><text x="356" y="430" font-size="20" class="mut">values</text></g><g class="q8u" style="animation-delay:2.80s"><rect x="324" y="466" width="22" height="22" rx="4" fill="#bb8009"/><text x="356" y="486" font-size="24" class="b">128 B</text><text x="356" y="512" font-size="20" class="mut">mask, 1 bit</text><text x="356" y="536" font-size="20" class="mut">per value</text></g><g class="q8u" style="animation-delay:3.00s"><text x="40" y="584" font-size="26" class="b">1,024 B + 128 B = 1,152 B</text></g><g class="q8u" style="animation-delay:3.30s"><text class="kick" x="40" y="664">FOUR VIEWS, ONE RECORD IN MEMORY</text></g><g class="q8p" style="animation-delay:3.40s"><text x="105" y="708" font-size="20" class="mut" text-anchor="middle">view 1</text><circle cx="105.0" cy="756.0" r="30.0" fill="#79c0ff" fill-opacity=".18" stroke="#58a6ff" stroke-width="3"/><path d="M126.6 777.6l16.5 16.5" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/></g><g class="q8d" style="animation-delay:4.00s"><path d="M105.0 800L276.0 840" pathLength="100" fill="none" stroke="#58a6ff" stroke-width="3"/></g><g class="q8p" style="animation-delay:4.60s"><text x="105" y="767" font-size="30" class="b" text-anchor="middle" style="fill:#56d364">✓</text></g><g class="q8p" style="animation-delay:3.55s"><text x="235" y="708" font-size="20" class="mut" text-anchor="middle">view 2</text><circle cx="235.0" cy="756.0" r="30.0" fill="#79c0ff" fill-opacity=".18" stroke="#58a6ff" stroke-width="3"/><path d="M256.6 777.6l16.5 16.5" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/></g><g class="q8d" style="animation-delay:4.10s"><path d="M235.0 800L292.0 840" pathLength="100" fill="none" stroke="#58a6ff" stroke-width="3"/></g><g class="q8p" style="animation-delay:4.75s"><text x="235" y="767" font-size="30" class="b" text-anchor="middle" style="fill:#56d364">✓</text></g><g class="q8p" style="animation-delay:3.70s"><text x="365" y="708" font-size="20" class="mut" text-anchor="middle">view 3</text><circle cx="365.0" cy="756.0" r="30.0" fill="#79c0ff" fill-opacity=".18" stroke="#58a6ff" stroke-width="3"/><path d="M386.6 777.6l16.5 16.5" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/></g><g class="q8d" style="animation-delay:4.20s"><path d="M365.0 800L308.0 840" pathLength="100" fill="none" stroke="#58a6ff" stroke-width="3"/></g><g class="q8p" style="animation-delay:4.90s"><text x="365" y="767" font-size="30" class="b" text-anchor="middle" style="fill:#56d364">✓</text></g><g class="q8p" style="animation-delay:3.85s"><text x="495" y="708" font-size="20" class="mut" text-anchor="middle">view 4</text><circle cx="495.0" cy="756.0" r="30.0" fill="#79c0ff" fill-opacity=".18" stroke="#58a6ff" stroke-width="3"/><path d="M516.6 777.6l16.5 16.5" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/></g><g class="q8d" style="animation-delay:4.30s"><path d="M495.0 800L324.0 840" pathLength="100" fill="none" stroke="#58a6ff" stroke-width="3"/></g><g class="q8p" style="animation-delay:5.05s"><text x="495" y="767" font-size="30" class="b" text-anchor="middle" style="fill:#56d364">✓</text></g><g class="q8u" style="animation-delay:3.80s"><rect x="268.0" y="840.0" width="64.0" height="64.0" fill="#388bfd"/><rect x="268.0" y="904.0" width="64.0" height="8.0" fill="#bb8009"/><rect x="268.0" y="840.0" width="64.0" height="72.0" fill="none" stroke="#e6edf3" stroke-width="2"/></g><g class="q8u" style="animation-delay:5.00s"><text x="300" y="958" font-size="26" class="b" text-anchor="middle">the same 1,152 B</text><text x="300" y="992" font-size="22" text-anchor="middle">each view: bit for bit</text><text x="300" y="1020" font-size="20" class="mut" text-anchor="middle">as a separate full copy would</text></g><g class="q8u" style="animation-delay:5.30s"><text x="40" y="1078" font-size="22" class="mut">held once</text><text x="186" y="1112" font-size="28" class="b">1,152 B</text></g><g class="q8g" style="animation-delay:5.30s"><rect class="q8size" x="40" y="1090" width="130.00" height="34" rx="6" fill="#58a6ff"/></g><g class="q8u" style="animation-delay:5.60s"><text x="40" y="1166" font-size="22" class="mut">4 copies would take</text><text x="560" y="1166" font-size="28" class="b" text-anchor="end">4,608 B</text></g><g class="q8p" style="animation-delay:5.70s"><rect class="q8size" x="42.00" y="1178" width="126.00" height="34" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2.5" stroke-dasharray="7 6"/></g><g class="q8p" style="animation-delay:5.82s"><rect class="q8size" x="172.00" y="1178" width="126.00" height="34" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2.5" stroke-dasharray="7 6"/></g><g class="q8p" style="animation-delay:5.94s"><rect class="q8size" x="302.00" y="1178" width="126.00" height="34" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2.5" stroke-dasharray="7 6"/></g><g class="q8p" style="animation-delay:6.06s"><rect class="q8size" x="432.00" y="1178" width="126.00" height="34" rx="6" fill="none" stroke="#9fb3c8" stroke-width="2.5" stroke-dasharray="7 6"/></g><g class="q8u" style="animation-delay:6.20s"><text x="40" y="1252" font-size="20" class="mut">75% less record material,</text><text x="40" y="1278" font-size="20" class="mut">not 75% less process RAM</text></g><g class="q8u" style="animation-delay:6.40s"><text class="kick" x="40" y="1338">WHAT IT IS NOT</text></g><g class="q8u" style="animation-delay:6.50s"><rect x="40" y="1371" width="16" height="4" rx="2" fill="#f85149"/><text x="70" y="1380" font-size="22">not 4 independent memories</text></g><g class="q8u" style="animation-delay:6.62s"><rect x="40" y="1409" width="16" height="4" rx="2" fill="#f85149"/><text x="70" y="1418" font-size="22">not 4 votes · not a speedup</text></g><g class="q8u" style="animation-delay:6.74s"><rect x="40" y="1447" width="16" height="4" rx="2" fill="#f85149"/><text x="70" y="1456" font-size="22">not a knowledge encoder</text></g><g class="q8u" style="animation-delay:6.90s"><text class="kick" x="40" y="1504">SEPARATE: A PUBLISHED COMMITMENT</text></g><g class="q8u" style="animation-delay:7.00s"><rect x="40" y="1524" width="520" height="248" rx="16" fill="#58a6ff" fill-opacity=".07" stroke="#30465f"/><path d="M60.0 1553.0v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#58a6ff" stroke-width="2.6"/><rect x="56.0" y="1553.0" width="20" height="15" rx="3" fill="#58a6ff"/><text x="96" y="1564" font-size="22" class="b">Target Q8 Quad quantizer</text><text x="96" y="1594" font-size="20">private · fixed 2026-11-05</text><text x="96" y="1624" font-size="20" class="mut">3 directories, 10 files</text><text x="96" y="1656" font-size="20">SHA-256 <tspan class="mono b" font-size="24" style="fill:#58a6ff">0034f6ee</tspan></text><text x="96" y="1690" font-size="20" class="mut">A hash shows the files did</text><text x="96" y="1716" font-size="20" class="mut">not change, not that they</text><text x="96" y="1742" font-size="20" class="mut">are correct.</text></g>
</svg>
