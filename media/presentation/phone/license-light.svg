<desc id="d">GEL RAM Noncommercial Reciprocal License 1.0 at a glance, quoted from LICENSE. Noncommercial use (section 3): 'a worldwide, non-exclusive, non-transferable, non-sublicensable, royalty-free copyright license to reproduce, run, study, modify, and share the Software for Noncommercial Purposes.' Evaluation, by anyone (sections 4 and 2): 'Any person or organization may evaluate the Software and may create Evaluation Modifications without payment and without a fixed evaluation deadline.' 'in a non-production environment solely to assess, learn about, validate, or decide whether to obtain commercial rights.' Money needs an agreement (section 5): 'Before beginning a Monetized Use, You must obtain a Commercial Agreement from the Licensor.' Every copy (section 8): 'each recipient receives this license, all copyright notices, and all plain-text lines beginning with `Required Notice:` supplied by the Licensor.' Commercial Agreements: gelram.licensing@gmail.com. A summary adds no rights; LICENSE controls (section 17).</desc>
