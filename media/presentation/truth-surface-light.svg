<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Truth surface, open questions and goals</title>
<desc id="d">Claims in the registry by status: 5 EXECUTABLE_CHECK, 11 SEPARATE_GATE, 15 MEASURED_LOCAL, 1 NOT_VERIFIED, 2 NOT_ESTABLISHED; none is marked as independently reproduced. Goals, not results: more natural questions answered with no wrong answers, a short answer taken from the source, UNKNOWN when there is no correct answer, and an independent reproduction.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="438" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="438" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<rect x="20" y="20" width="540" height="400" rx="16" fill="#f7fbff" fill-opacity=".6" stroke="#cbdcf0"/><rect x="580" y="20" width="600" height="400" rx="16" fill="#f7fbff" fill-opacity=".6" stroke="#cbdcf0"/><text class="kick" x="44" y="56">TRUTH SURFACE · CLAIMS BY STATUS</text><circle cx="54" cy="96" r="8" fill="#2da44e"/><text x="74" y="100" font-size="13" class="mono">EXECUTABLE_CHECK</text><text x="74" y="119" font-size="12" class="mut">run against the library in CI</text><text x="530" y="108" font-size="26" class="b" text-anchor="end">5</text><circle cx="54" cy="152" r="8" fill="#2f7fe0"/><text x="74" y="156" font-size="13" class="mono">SEPARATE_GATE</text><text x="74" y="175" font-size="12" class="mut">checked by its own gate or report</text><text x="530" y="164" font-size="26" class="b" text-anchor="end">11</text><circle cx="54" cy="208" r="8" fill="#d4a72c"/><text x="74" y="212" font-size="13" class="mono">MEASURED_LOCAL</text><text x="74" y="231" font-size="12" class="mut">measured by the owner; not re-runnable here</text><text x="530" y="220" font-size="26" class="b" text-anchor="end">15</text><circle cx="54" cy="264" r="8" fill="#486380"/><text x="74" y="268" font-size="13" class="mono">NOT_VERIFIED</text><text x="74" y="287" font-size="12" class="mut">open: not verified yet</text><text x="530" y="276" font-size="26" class="b" text-anchor="end">1</text><circle cx="54" cy="320" r="8" fill="#486380"/><text x="74" y="324" font-size="13" class="mono">NOT_ESTABLISHED</text><text x="74" y="343" font-size="12" class="mut">not shown, so not claimed</text><text x="530" y="332" font-size="26" class="b" text-anchor="end">2</text><text x="44" y="400" font-size="13" class="mut">None is marked as independently reproduced: none has been.</text><text class="kick" x="604" y="56">OPEN QUESTIONS · GOALS, NOT RESULTS</text><circle cx="616" cy="93" r="13" fill="none" stroke="#0969da" stroke-width="2"/><text x="616" y="98" font-size="13" class="b" text-anchor="middle">1</text><text x="642" y="98" font-size="15" class="b">Natural question coverage</text><text x="642" y="118" font-size="13" class="mut">now 11 of 80 answered, 0 wrong</text><text x="642" y="137" font-size="13" style="fill:#0969da">goal: most of a new frozen set answered, still 0 wrong · not achieved yet</text><circle cx="616" cy="165" r="13" fill="none" stroke="#0969da" stroke-width="2"/><text x="616" y="170" font-size="13" class="b" text-anchor="middle">2</text><text x="642" y="170" font-size="15" class="b">Answer form</text><text x="642" y="190" font-size="13" class="mut">now the whole source passage</text><text x="642" y="209" font-size="13" style="fill:#0969da">goal: a short answer taken from that passage · not achieved yet</text><circle cx="616" cy="237" r="13" fill="none" stroke="#0969da" stroke-width="2"/><text x="616" y="242" font-size="13" class="b" text-anchor="middle">3</text><text x="642" y="242" font-size="15" class="b">Questions without an answer</text><text x="642" y="262" font-size="13" class="mut">now no public control</text><text x="642" y="281" font-size="13" style="fill:#0969da">goal: UNKNOWN on invented subjects and false premises · not achieved yet</text><circle cx="616" cy="309" r="13" fill="none" stroke="#0969da" stroke-width="2"/><text x="616" y="314" font-size="13" class="b" text-anchor="middle">4</text><text x="642" y="314" font-size="15" class="b">Independent reproduction</text><text x="642" y="334" font-size="13" class="mut">now none recorded</text><text x="642" y="353" font-size="13" style="fill:#0969da">goal: a first external run of xtask verify · not achieved yet</text><text x="604" y="400" font-size="13" class="mut">A goal becomes a result only when published with its frozen protocol and evidence.</text>
</svg>
