<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="t d">
<title id="t">Truth surface</title>
<desc id="d">Claims in the registry by status: 5 EXECUTABLE_CHECK, 11 SEPARATE_GATE, 15 MEASURED_LOCAL, 1 NOT_VERIFIED, 2 NOT_ESTABLISHED. None is marked as independently reproduced.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="254" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="254" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="48">TRUTH SURFACE · EVERY CLAIM IN THE REGISTRY HAS ONE STATUS</text><rect x="40" y="68" width="212" height="132" rx="14" fill="#f7fbff" stroke="#cbdcf0"/><text x="58" y="116" font-size="40" class="b">5</text><text x="58" y="142" font-size="12" class="mono">EXECUTABLE_CHECK</text><text x="58" y="166" font-size="13" class="mut">run against the library</text><text x="58" y="184" font-size="13" class="mut">in CI on every change</text><rect x="268" y="68" width="212" height="132" rx="14" fill="#f7fbff" stroke="#cbdcf0"/><text x="286" y="116" font-size="40" class="b">11</text><text x="286" y="142" font-size="12" class="mono">SEPARATE_GATE</text><text x="286" y="166" font-size="13" class="mut">checked by its own</text><text x="286" y="184" font-size="13" class="mut">gate or report</text><rect x="496" y="68" width="212" height="132" rx="14" fill="#f7fbff" stroke="#cbdcf0"/><text x="514" y="116" font-size="40" class="b">15</text><text x="514" y="142" font-size="12" class="mono">MEASURED_LOCAL</text><text x="514" y="166" font-size="13" class="mut">measured by the owner;</text><text x="514" y="184" font-size="13" class="mut">not re-runnable here</text><rect x="724" y="68" width="212" height="132" rx="14" fill="#f7fbff" stroke="#cbdcf0"/><text x="742" y="116" font-size="40" class="b">1</text><text x="742" y="142" font-size="12" class="mono">NOT_VERIFIED</text><text x="742" y="166" font-size="13" class="mut">open:</text><text x="742" y="184" font-size="13" class="mut">not verified yet</text><rect x="952" y="68" width="212" height="132" rx="14" fill="#f7fbff" stroke="#cbdcf0"/><text x="970" y="116" font-size="40" class="b">2</text><text x="970" y="142" font-size="12" class="mono">NOT_ESTABLISHED</text><text x="970" y="166" font-size="13" class="mut">not shown,</text><text x="970" y="184" font-size="13" class="mut">so not claimed</text><text x="40" y="232" font-size="14" class="mut">No claim is marked as independently reproduced: none has been. The registry is docs/CLAIMS.md.</text>
</svg>
