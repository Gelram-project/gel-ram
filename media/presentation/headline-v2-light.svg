<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
<title id="t">GEL RAM on 394 frozen questions</title>
<desc id="d">394 frozen questions drawn at random, one recorded run. GEL RAM answered 63: 59 correct, 4 wrong, 331 UNKNOWN. Three language models, closed book: 80 to 233 wrong answers. Private measurement; questions from the GEL bank; not a neutral leaderboard.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="248" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="248" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<rect x="20" y="20" width="1160" height="210" rx="16" fill="#f7fbff" fill-opacity=".6" stroke="#cbdcf0"/><text class="kick" x="44" y="56">394 FROZEN QUESTIONS · DRAWN AT RANDOM · ONE RECORDED RUN</text><text x="44" y="134" font-size="64" class="b" style="fill:#1a7f37">59</text><text x="44" y="162" font-size="15" class="mut">correct</text><text x="244" y="134" font-size="64" class="b" style="fill:#b3242a">4</text><text x="244" y="162" font-size="15" class="mut">wrong</text><text x="384" y="134" font-size="64" class="b" style="fill:#486380">331</text><text x="384" y="162" font-size="15" class="mut">UNKNOWN</text><text x="660" y="100" font-size="21" class="b">GEL RAM answered 63 of 394.</text><text x="660" y="128" font-size="15" class="mut">Each answer is a stored source passage; otherwise UNKNOWN.</text><text x="660" y="152" font-size="15" class="mut">Three language models, closed book: 80–233 wrong answers.</text><text x="44" y="208" font-size="13" class="mut">Private measurement · questions from the GEL bank · models closed book · not a neutral leaderboard</text>
</svg>
