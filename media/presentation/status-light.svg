<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t d">
<title id="t">Where GEL RAM stands</title>
<desc id="d">Checkable here: exact read-back through four views, a changed byte refused, nothing confirmed lost to a kill. Private: printing and answering; 9 published commitments fix the contents of private directories as of their dates; only their labels say what each holds. The text AI is a goal.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.kick{font-size:16px}.sc{animation:strise .75s cubic-bezier(.2,.8,.2,1) both}.si{animation:stfade .6s ease-out both}.sd{animation:stdraw .9s ease-out both}.sp{animation:stpulse .7s ease-in-out both;transform-box:fill-box;transform-origin:center}.sn{animation:stpop .7s cubic-bezier(.2,.8,.2,1) 1.8s both;transform-box:fill-box;transform-origin:center}@keyframes strise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}@keyframes stfade{from{opacity:0}to{opacity:1}}@keyframes stdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes stpulse{0%,100%{transform:none}50%{transform:scale(1.16)}}@keyframes stpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}.mut{fill:#486380}.b{font-weight:700}@media (prefers-reduced-motion:reduce){.sc,.si,.sd,.sp,.sn{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="448" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="448" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="40" y="40">WHERE GEL RAM STANDS</text><g class="sc" style="animation-delay:0.10s"><clipPath id="stcol0"><rect x="40" y="58" width="360" height="376.0" rx="18"/></clipPath><rect x="40" y="58" width="360" height="376.0" rx="18" fill="#1a7f37" fill-opacity=".07" stroke="#1a7f37" stroke-opacity=".45"/><rect x="40" y="58" width="360" height="8" fill="#1a7f37" clip-path="url(#stcol0)"/><g transform="translate(86 104)"><g class="sp" style="animation-delay:1.30s"><circle r="26" fill="#1a7f37" fill-opacity=".14" stroke="#1a7f37" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-13 1L-4 10L14 -10" stroke="#1a7f37" stroke-width="6"/></g></g><text x="122" y="113" font-size="26" class="b" style="fill:#1a7f37">Check it here</text><path d="M64 134H376" stroke="#1a7f37" stroke-opacity=".35" stroke-width="1.5"/><g class="si" style="animation-delay:0.55s"><circle cx="66" cy="151.0" r="4.5" fill="#1a7f37"/><text x="80" y="158.0" font-size="20">One record read back</text><text x="80" y="182.0" font-size="20">exactly through four</text><text x="80" y="206.0" font-size="20">views</text></g><g class="si" style="animation-delay:0.70s"><circle cx="66" cy="233.0" r="4.5" fill="#1a7f37"/><text x="80" y="240.0" font-size="20">A changed byte refused</text></g><g class="si" style="animation-delay:0.85s"><circle cx="66" cy="267.0" r="4.5" fill="#1a7f37"/><text x="80" y="274.0" font-size="20">A killed process</text><text x="80" y="298.0" font-size="20">losing nothing it</text><text x="80" y="322.0" font-size="20">confirmed</text></g><rect x="56" y="340.0" width="328" height="80" rx="12" fill="#1a7f37" fill-opacity=".13"/><text class="b" x="220" y="387.0" font-size="20" text-anchor="middle" style="fill:#1a7f37">One command each</text></g><g class="sc" style="animation-delay:0.50s"><clipPath id="stcol1"><rect x="420" y="58" width="360" height="376.0" rx="18"/></clipPath><rect x="420" y="58" width="360" height="376.0" rx="18" fill="#0969da" fill-opacity=".07" stroke="#0969da" stroke-opacity=".45"/><rect x="420" y="58" width="360" height="8" fill="#0969da" clip-path="url(#stcol1)"/><g transform="translate(466 104)"><g class="sp" style="animation-delay:1.70s"><circle r="26" fill="#0969da" fill-opacity=".14" stroke="#0969da" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-8.5 -3V-9A8.5 8.5 0 0 1 8.5 -9V-3" stroke="#0969da" stroke-width="4.5"/><rect x="-14" y="-3" width="28" height="21" rx="4" fill="#0969da"/><circle cx="0" cy="5.5" r="3" fill="#f7fbff"/><rect x="-1.4" y="6" width="2.8" height="6" fill="#f7fbff"/></g></g><text x="502" y="113" font-size="26" class="b" style="fill:#0969da">Private</text><path d="M444 134H756" stroke="#0969da" stroke-opacity=".35" stroke-width="1.5"/><g class="si" style="animation-delay:0.95s"><circle cx="446" cy="151.0" r="4.5" fill="#0969da"/><text x="460" y="158.0" font-size="20">The step that prints</text><text x="460" y="182.0" font-size="20">text into records</text></g><g class="si" style="animation-delay:1.10s"><circle cx="446" cy="209.0" r="4.5" fill="#0969da"/><text x="460" y="216.0" font-size="20">The private build that</text><text x="460" y="240.0" font-size="20">answers from them</text></g><g class="si" style="animation-delay:1.25s"><circle cx="446" cy="267.0" r="4.5" fill="#0969da"/><text x="460" y="274.0" font-size="20">Both exist only on the</text><text x="460" y="298.0" font-size="20">author's machine</text></g><rect x="436" y="340.0" width="328" height="80" rx="12" fill="#0969da" fill-opacity=".13"/><text class="sn b" x="452" y="394.0" font-size="40" style="fill:#0969da">9</text><text class="b" x="490.0" y="364.0" font-size="16">published commitments</text><text x="490.0" y="386.0" font-size="16">fix private files</text><text x="490.0" y="408.0" font-size="16">as of their dates</text></g><g class="sc" style="animation-delay:0.90s"><clipPath id="stcol2"><rect x="800" y="58" width="360" height="376.0" rx="18"/></clipPath><rect x="800" y="58" width="360" height="376.0" rx="18" fill="#9a6700" fill-opacity=".07" stroke="#9a6700" stroke-opacity=".45"/><rect x="800" y="58" width="360" height="8" fill="#9a6700" clip-path="url(#stcol2)"/><g transform="translate(846 104)"><g class="sp" style="animation-delay:2.10s"><circle r="26" fill="#9a6700" fill-opacity=".14" stroke="#9a6700" stroke-width="2.5"/><path class="sd" pathLength="100" stroke-dasharray="100" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M-11 -15H11M-11 15H11M-8.5 -15C-8.5 -3 8.5 3 8.5 15M8.5 -15C8.5 -3 -8.5 3 -8.5 15" stroke="#9a6700" stroke-width="3.5"/><path d="M-5.5 12H5.5L0 5Z" fill="#9a6700"/></g></g><text x="882" y="113" font-size="26" class="b" style="fill:#9a6700">Not established</text><path d="M824 134H1136" stroke="#9a6700" stroke-opacity=".35" stroke-width="1.5"/><g class="si" style="animation-delay:1.35s"><circle cx="826" cy="151.0" r="4.5" fill="#9a6700"/><text x="840" y="158.0" font-size="20">The text AI is a goal,</text><text x="840" y="182.0" font-size="20">not a result</text></g><g class="si" style="animation-delay:1.50s"><circle cx="826" cy="209.0" r="4.5" fill="#9a6700"/><text x="840" y="216.0" font-size="20">Hardware-level memory</text><text x="840" y="240.0" font-size="20">computation</text></g><g class="si" style="animation-delay:1.65s"><circle cx="826" cy="267.0" r="4.5" fill="#9a6700"/><text x="840" y="274.0" font-size="20">Power-cut durability</text><text x="840" y="298.0" font-size="20">of snapshots and of</text><text x="840" y="322.0" font-size="20">the record history</text></g><rect x="816" y="340.0" width="328" height="80" rx="12" fill="#9a6700" fill-opacity=".13"/><text class="mono b" x="980" y="387.0" font-size="20" text-anchor="middle" style="fill:#9a6700">NOT_ESTABLISHED</text></g>
</svg>
