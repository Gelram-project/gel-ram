<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
<title id="t">Open questions and goals</title>
<desc id="d">Goals, not results: more natural questions answered with no wrong answers, a short answer taken from the source, UNKNOWN when there is no correct answer, and an independent reproduction.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#102949}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#486380}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#0969da}
.mut{fill:#486380}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#deedff"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="398" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="398" rx="24" fill="url(#bg)" stroke="#cbdcf0"/>
<text class="kick" x="48" y="50">OPEN QUESTIONS · GOALS, NOT RESULTS</text><text x="330" y="88" font-size="13" class="mut" letter-spacing="1">MEASURED NOW (PUBLIC)</text><text x="680" y="88" font-size="13" letter-spacing="1" style="fill:#0969da">GOAL — NOT ACHIEVED YET</text><path d="M48 100H1152" stroke="#cbdcf0"/><text x="48" y="126" font-size="17" class="b">Natural questions</text><text x="330" y="126" font-size="16">11 of 80 answered, 0 wrong</text><text x="680" y="126" font-size="16" style="fill:#0969da">most of a new, frozen, held-out set answered, still 0 wrong</text><path d="M48 158H1152" stroke="#cbdcf0"/><text x="48" y="184" font-size="17" class="b">Answer form</text><text x="330" y="184" font-size="16">the whole source passage</text><text x="680" y="184" font-size="16" style="fill:#0969da">a short answer taken from the passage, scored by the models' rule</text><path d="M48 216H1152" stroke="#cbdcf0"/><text x="48" y="242" font-size="17" class="b">No correct answer</text><text x="330" y="242" font-size="16">no public control yet</text><text x="680" y="242" font-size="16" style="fill:#0969da">UNKNOWN on invented subjects and false premises, on a frozen set</text><path d="M48 274H1152" stroke="#cbdcf0"/><text x="48" y="300" font-size="17" class="b">Reproduction</text><text x="330" y="300" font-size="16">no independent run recorded</text><text x="680" y="300" font-size="16" style="fill:#0969da">a first external run of xtask verify, published as it comes</text><text x="48" y="376" font-size="14" class="mut">A goal becomes a result only when it is published with its frozen protocol and evidence.</text>
</svg>
