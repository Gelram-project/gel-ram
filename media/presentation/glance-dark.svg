<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="328" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#bg)" stroke="#30465f"/>
<text class="kick" x="48" y="56">ANSWER OR ABSTAIN · 80 NATURAL QUESTIONS · ONE RECORDED RUN</text><text x="48" y="100" font-size="34" class="b">Evidence you can inspect</text><text x="48" y="180" font-size="60" class="b" style="fill:#58a6ff">11 / 80</text><text x="48" y="214" font-size="19" class="b">correct answers</text><text x="48" y="240" font-size="15" class="mut">each with its source passage</text><text x="432" y="180" font-size="60" class="b" style="fill:#56d364">0</text><text x="432" y="214" font-size="19" class="b">wrong answers</text><text x="432" y="240" font-size="15" class="mut">among the 11 answers · 95% Wilson lower bound 0.74</text><text x="816" y="180" font-size="60" class="b" style="fill:#e6edf3">69</text><text x="816" y="214" font-size="19" class="b">UNKNOWN</text><text x="816" y="240" font-size="15" class="mut">said instead of guessing</text><path d="M48 266H1152" stroke="#30465f"/><text x="48" y="298" font-size="15" class="mut">Separate experiment, not questions: 99.95% correct answers when 50,000 stored passages are read back (92.8% answered).</text>
