<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="206" viewBox="0 0 1200 206" role="img" aria-labelledby="t d">
<title id="t">Evidence you can inspect</title>
<desc id="d">On 80 natural questions GEL RAM gave 11 correct answers, 0 wrong and 69 UNKNOWN. A different experiment, not questions: 99.95% correct answers when 50,000 stored passages are read back.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.mut{fill:#9fb3c8}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="204" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="204" rx="24" fill="url(#bg)" stroke="#30465f"/>
<text class="kick" x="40" y="48">80 NATURAL QUESTIONS · 40 POLISH, 40 ENGLISH · ONE RECORDED RUN</text><text x="40" y="118" font-size="52" class="b" style="fill:#58a6ff">11 / 80</text><text x="40" y="150" font-size="18" class="b">correct answers</text><text x="40" y="174" font-size="14" class="mut">each with its source passage</text><text x="325" y="118" font-size="52" class="b" style="fill:#56d364">0</text><text x="325" y="150" font-size="18" class="b">wrong among answered</text><text x="325" y="174" font-size="14" class="mut">of 11 answers · Wilson 95% ≥ 0.74</text><text x="610" y="118" font-size="52" class="b" style="fill:#e6edf3">69</text><text x="610" y="150" font-size="18" class="b">UNKNOWN</text><text x="610" y="174" font-size="14" class="mut">said instead of guessing</text><path d="M890 76V182" stroke="#30465f"/><text x="920" y="118" font-size="52" class="b" style="fill:#58a6ff">99.95%</text><text x="920" y="150" font-size="18" class="b">stored-passage read-back</text><text x="920" y="174" font-size="14" class="mut">50,000 probes · not questions</text>
</svg>
