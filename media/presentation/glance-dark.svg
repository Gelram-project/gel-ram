<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="484" viewBox="0 0 1200 484" role="img" aria-labelledby="t d">
<title id="t">Versions 0.8 and 0.9 at a glance</title>
<desc id="d">Versions 0.8 and 0.9 at a glance. New in 0.9: 20 fault tests of saved files, 4 Unix-only, no power-loss test; 72 memory samples of 8 operations, one machine, process-wide, untimed; 6 kinds of value replaced in witness step lines. Since 0.8: 8 tool programs answer --version and --license.</desc>
