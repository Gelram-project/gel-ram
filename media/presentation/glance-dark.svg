<title id="t">Evidence you can inspect</title>
<desc id="d">On 80 natural questions GEL RAM gave 11 correct answers, 0 wrong and 69 UNKNOWN.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
