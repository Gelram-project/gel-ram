<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">One stored Q8 record, four exact views</title>
<desc id="d">One stored Q8 record: 1,024 one-byte values and a 128-byte activity mask, 1,152 bytes, read through four equivalent views without four copies. Four packed copies would take 4,608 bytes; the reference layout used for checking takes 8,192 bytes. 48 of 48 recorded runs end with Q8_QUAD_EXACT=PASS; semantic accuracy is not measured. Record payload only, not process memory; not four independent memories.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;fill:#9fb3c8}
.kick{font-size:13px;font-weight:700;letter-spacing:2px;fill:#58a6ff}
.mut{fill:#9fb3c8}.b{font-weight:700}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<clipPath id="card"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#bg)" stroke="#30465f"/>
<text class="kick" x="40" y="48">ONE STORED Q8 RECORD</text><text x="40" y="118" font-size="52" class="b" style="fill:#58a6ff">1,152 B</text><text x="40" y="150" font-size="16" class="mut">1,024 one-byte values + 128-byte activity mask</text><defs><clipPath id="rec"><rect x="40" y="178" width="400" height="56" rx="8"/></clipPath></defs><g clip-path="url(#rec)"><rect x="40" y="178" width="355.6" height="56" fill="#79c0ff"/><rect x="395.6" y="178" width="44.4" height="56" fill="#e3b341"/><path d="M62.2 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M84.4 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M106.7 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M128.9 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M151.1 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M173.3 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M195.6 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M217.8 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M240.0 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M262.2 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M284.4 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M306.7 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M328.9 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M351.1 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/><path d="M373.3 178v56" stroke="#1f6feb" stroke-width="1" opacity=".35"/></g><rect x="40" y="178" width="400" height="56" rx="8" fill="none" stroke="#e6edf3" stroke-width="2"/><text class="mono" x="40" y="254" font-size="12">1,024 B values</text><text class="mono" x="440" y="254" font-size="12" text-anchor="end">128 B mask</text><path d="M440 206C510 206 500 83 560 83" stroke="#58a6ff" stroke-width="2" fill="none"/><rect x="560" y="64" width="180" height="38" rx="10" fill="#101d31" stroke="#58a6ff" stroke-width="2"/><text x="650" y="89" font-size="16" class="b" text-anchor="middle">view 1</text><path d="M440 206C510 206 500 133 560 133" stroke="#58a6ff" stroke-width="2" fill="none"/><rect x="560" y="114" width="180" height="38" rx="10" fill="#101d31" stroke="#58a6ff" stroke-width="2"/><text x="650" y="139" font-size="16" class="b" text-anchor="middle">view 2</text><path d="M440 206C510 206 500 183 560 183" stroke="#58a6ff" stroke-width="2" fill="none"/><rect x="560" y="164" width="180" height="38" rx="10" fill="#101d31" stroke="#58a6ff" stroke-width="2"/><text x="650" y="189" font-size="16" class="b" text-anchor="middle">view 3</text><path d="M440 206C510 206 500 233 560 233" stroke="#58a6ff" stroke-width="2" fill="none"/><rect x="560" y="214" width="180" height="38" rx="10" fill="#101d31" stroke="#58a6ff" stroke-width="2"/><text x="650" y="239" font-size="16" class="b" text-anchor="middle">view 4</text><text class="kick" x="780" y="96">FOR COMPARISON</text><text x="780" y="132" font-size="17" class="b">four packed copies: 4,608 B</text><text x="780" y="154" font-size="13" class="mut">not stored; the record is kept once</text><text x="780" y="196" font-size="16" class="b">reference layout used for checking: 8,192 B</text><text x="780" y="218" font-size="13" class="mut">four materialized views, built to check each score</text><rect x="40" y="272" width="1120" height="34" rx="17" fill="#101d31" stroke="#30465f"/><text class="mono" x="60" y="294" font-size="14"><tspan class="b" style="fill:#56d364">48 of 48 recorded runs:</tspan> Q8_QUAD_EXACT=PASS · SEMANTIC_ACCURACY=NOT_MEASURED</text><text x="40" y="338" font-size="13" class="mut">Record payload only; process memory is additional. Four views are not four independent memories.</text>
</svg>
