name: audit-snapshot
# Optional read-only export of public, tracked source for offline review.
# No compiler, credentials, private directories, release or repository write.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check and archive the exact public revision
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/source-expected.txt"
          git ls-files | grep -v '^SOURCE-SHA256SUMS\.txt$' | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done > "$expected"
          diff -u SOURCE-SHA256SUMS.txt "$expected"
          out="$RUNNER_TEMP/public-review"
          mkdir "$out"
          git archive --format=zip --output="$out/public-source.zip" HEAD
          git rev-parse HEAD > "$out/COMMIT.txt"
          (cd "$out" && sha256sum public-source.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-source-review
          path: ${{ runner.temp }}/public-review/
          if-no-files-found: error
          retention-days: 7
