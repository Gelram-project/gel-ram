name: Feature proposal
description: Propose a focused improvement to the public GEL RAM repository.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete public memory/readout, integrity, persistence, verification or reproducibility problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the public API, format, algorithm, test or documentation change and its compatibility impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Exactness and measurement evidence
      description: State which invariants remain true and how correctness/performance would be tested. Include negative results where relevant.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal stays within the public GEL RAM scope and does not request disclosure of unpublished private mechanisms.
          required: true
        - label: I understand that a code contribution intended for merge requires the private CLA process described in CONTRIBUTING.md.
          required: true
