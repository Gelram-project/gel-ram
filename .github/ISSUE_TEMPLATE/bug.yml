name: Bug report
description: Report a reproducible GEL RAM defect that is not a security vulnerability.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, private datasets, unpublished private implementation details or unpatched security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: GEL RAM release or commit
      placeholder: v0.3.0 or a complete current-main commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Rust version
      placeholder: Linux x86-64, rustc 1.85.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: List the exact commands and smallest public or synthetic input needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed this is not a private security report.
          required: true
        - label: I removed secrets, personal data, private datasets and confidential information.
          required: true
