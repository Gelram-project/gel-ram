name: Benchmark or correctness reproduction
description: Share an independent test of the public GEL RAM core, including slower or failing cases.
title: "reproduction: "
body:
  - type: markdown
    attributes:
      value: |
        Independent reproductions are especially valuable. Please report the exact revision and all relevant results, including slow or failing runs. Do not include private GEL data or unpublished private mechanisms.
  - type: dropdown
    id: relationship
    attributes:
      label: Who ran this test?
      description: Tests by the project author or affiliated contributors are useful, but they are not independent reproductions.
      options:
        - Independent — no involvement in GEL RAM development
        - Contributor or otherwise affiliated with the project
        - Project author or maintainer
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or release tag
      description: Include the exact commit SHA or release tag tested.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and environment
      description: CPU, installed/usable RAM, OS, Rust version, compiler flags, affinity and background load/power settings if known.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Exact commands
      render: text
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Input and success contract fixed before the test
      description: Identify public or synthetic input, size, input hash, operation, expected result and accepted error. State cold/warm cache assumptions and build profile. Do not upload private data.
    validations:
      required: true
  - type: textarea
    id: usability
    attributes:
      label: First-run usability and scope
      description: Optional — time to first correct result, steps that failed, and which behavior you understood as public versus private. Do not count compilation time as retrieval latency.
  - type: textarea
    id: results
    attributes:
      label: Correctness and complete results
      description: Include PASS/failure markers, every timing trial used in a summary, memory/resource observations and regressions. Do not report p99.9+ from insufficient sample counts.
      render: text
    validations:
      required: true
  - type: textarea
    id: hashes
    attributes:
      label: Output and log hashes
      description: SHA256 of the input files, the complete output/log files and any generated report (for example the xtask ci-evidence SHA256SUMS.txt). A hash identifies bytes; it does not authenticate the tester or prove correctness.
      render: text
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am reporting only public GEL RAM behavior; I am not requesting disclosure of private implementation details.
          required: true
        - label: I removed credentials, usernames/private paths, private datasets and confidential information from this report.
          required: true
