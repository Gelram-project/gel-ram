[workspace]
resolver = "2"
members = [
  "crates/gel-core",
  "crates/gel-phase-quad",
  "crates/gel-orb",
  "crates/gel-kernel",
  "crates/gel-reader",
  "crates/gel-structural",
  "crates/gel-history",
  "crates/gel-store",
  "crates/gel-source",
  "crates/gel-live-lab",
  "crates/gel-physics",
  "crates/gel-bench",
  "crates/gel-cli",
  "xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.100"
publish = false
license-file = "LICENSE"

[workspace.lints.rust]
unsafe_code = "forbid"

# With rust-version 1.100, clippy suggests three APIs newer than Rust 1.85.0:
# as_chunks, is_multiple_of and isolate_lowest_one. The measured loops are kept
# as they are; taking up those APIs is a change of its own, timed with its own
# A/A runs.
[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"
manual_isolate_lowest_one = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
